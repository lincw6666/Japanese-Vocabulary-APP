            }, [studyIndex, studyVocabList, currentTab]);

            const [listeningIndex, setListeningIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isStopped, setIsStopped] = useState(true);
            const [isListeningRandom, setIsListeningRandom] = useState(false);
            const [isListeningLoop, setIsListeningLoop] = useState(false);
            const [listeningPlaylist, setListeningPlaylist] = useState([]);

            const isListeningLoopRef = React.useRef(isListeningLoop);
            isListeningLoopRef.current = isListeningLoop;
            const isListeningRandomRef = React.useRef(isListeningRandom);
            isListeningRandomRef.current = isListeningRandom;

            const generatePlaylist = (length, isRandom, startIndex = 0) => {
                let list = Array.from({length}, (_, i) => i);
                if (isRandom) {
                    for (let i = list.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [list[i], list[j]] = [list[j], list[i]];
                    }
                } else {
                    if (startIndex > 0 && startIndex < length) {
                        list = [...list.slice(startIndex), ...list.slice(0, startIndex)];
                    }
                }
                return list;
            };

            // 👉 升級：動態產生聽力列表組合的「複合鍵」
            const getListeningConditionKey = useCallback(() => {
                return `lvl:${selectedLevels.join(',')}_cat:${selectedCategories.join(',')}_fav:${isFavoritesMode}`;
            }, [selectedLevels, selectedCategories, isFavoritesMode]);

            useEffect(() => {
                const len = activeVocabList.length;
                if (len > 0) {
                    const conditionKey = getListeningConditionKey();
                    const vocabKey = `${len}_${activeVocabList[0].id}_${activeVocabList[len-1].id}`;
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('listeningProgressMap')) || {};
                        const saved = savedMap[conditionKey];

                        // 確保單字庫沒有因為外部vocab檔案變更而大改
                        if (saved && saved.vocabKey === vocabKey) {
                            setListeningPlaylist(saved.playlist);
                            setListeningIndex(saved.index < len ? saved.index : 0);
                            setIsListeningRandom(!!saved.random);
                            setIsListeningLoop(!!saved.loop);
                            setIsStopped(true);
                            setIsPlaying(false);
                            return;
                        }
                    } catch (e) {}

                    setListeningPlaylist(generatePlaylist(len, isListeningRandomRef.current, 0));
                    setListeningIndex(0);
                    setIsStopped(true);
                    setIsPlaying(false);
                } else {
                    setListeningPlaylist([]);
                }
            }, [activeVocabList, getListeningConditionKey]);

            // 👉 升級：自動儲存聽力模式進度至 Progress Map
            useEffect(() => {
                if (activeVocabList.length > 0 && listeningPlaylist.length > 0) {
                    const conditionKey = getListeningConditionKey();
                    const vocabKey = `${activeVocabList.length}_${activeVocabList[0].id}_${activeVocabList[activeVocabList.length-1].id}`;
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('listeningProgressMap')) || {};
                        savedMap[conditionKey] = {
                            vocabKey,
                            playlist: listeningPlaylist,
                            index: listeningIndex,
                            random: isListeningRandom,
                            loop: isListeningLoop
                        };
                        localStorage.setItem('listeningProgressMap', JSON.stringify(savedMap));
                    } catch (e) {}
                }
            }, [listeningIndex, listeningPlaylist, isListeningRandom, isListeningLoop, activeVocabList, getListeningConditionKey]);

            const currentAudioSourceRef = React.useRef(null);
            const sequenceIdRef = React.useRef(0);

            useEffect(() => {
                if (currentTab !== 'listening' || !isPlaying || activeVocabList.length === 0 || listeningPlaylist.length === 0) {
                    stopCurrentAudio();
                    sequenceIdRef.current++;
                    return;
                }

                let isCancelled = false;
                const seqId = ++sequenceIdRef.current;
                const word = activeVocabList[listeningPlaylist[listeningIndex]];

                if (!word) return; // 👉 關鍵防呆：避免切換瞬間陣列尚未同步導致 crash

                const runSequence = async () => {
                    const items = [
                        { url: `./audio/${word.id}_ja.mp3`, delay: 500 },
                        { url: `./audio/${word.id}_ja.mp3`, delay: 800 },
                        { url: `./audio/${word.id}_zh.mp3`, delay: 1000 }
                    ];

                    if (word.example) {
                        items.push({ url: `./audio/${word.id}_ex_ja.mp3`, delay: 1200 });
                        if (word.example.includes('(')) {
                            items.push({ url: `./audio/${word.id}_ex_zh.mp3`, delay: 800 });
                        }
                    }

                    for (let item of items) {
                        if (isCancelled || sequenceIdRef.current !== seqId) return;
                        if (item.delay) await new Promise(r => setTimeout(r, item.delay));
                        if (isCancelled || sequenceIdRef.current !== seqId) return;

                        const playLocalFile = async (url) => {
                            try {
                                if (isCancelled || sequenceIdRef.current !== seqId) return;
                                const ctx = getAudioCtx();

                                let response = null;
                                let fetchSuccess = false;
                                for (let attempt = 1; attempt <= 3; attempt++) {
                                    try {
                                        response = await fetch(url);
                                        if (response.ok) { fetchSuccess = true; break; }
                                    } catch (e) {
                                        if (attempt === 3) break;
                                        await new Promise(r => setTimeout(r, 200));
                                    }
                                }

                                if (!fetchSuccess) {
                                    if (window.location.protocol === 'file:') {
                                        alert("⚠️ Safari 安全限制警告\n\niOS Safari 嚴格禁止在單機模式 (file://) 下讀取音檔。\n請上傳至 GitHub Pages 上測試。");
                                        setIsPlaying(false);
                                        setIsStopped(true);
                                    }
                                    return;
                                }

                                const arrayBuffer = await response.arrayBuffer();
                                // 👉 防護 2-1：強制捕捉 Safari 解碼器的同步崩潰
                                const audioBuffer = await new Promise((res, rej) => {
                                    try { ctx.decodeAudioData(arrayBuffer, res, rej); }
                                    catch (e) { rej(e); }
                                });
                                if (isCancelled || sequenceIdRef.current !== seqId) return;

                                await new Promise((resolve) => {
                                    const source = ctx.createBufferSource();
                                    source.buffer = audioBuffer;
                                    source.playbackRate.value = playbackRateRef.current; // 👉 應用當前語速
                                    source.connect(ctx.destination);
                                    currentAudioSourceRef.current = source;
                                    source.onended = () => { currentAudioSourceRef.current = null; resolve(); };
                                    source.start(0);
                                });
                            } catch (error) {}
                        };
                        await playLocalFile(item.url);
                    }

                    if (isCancelled || sequenceIdRef.current !== seqId) return;
                    await new Promise(r => setTimeout(r, 1500));
                    if (isCancelled || sequenceIdRef.current !== seqId) return;

                    const len = activeVocabList.length;
                    if (listeningIndex + 1 >= len) {
                        if (!isListeningLoopRef.current) {
                            setIsPlaying(false); setIsStopped(true);
                        } else {
                            if (isListeningRandomRef.current) setListeningPlaylist(generatePlaylist(len, true));
                            setListeningIndex(0);
                        }
                    } else {
                        setListeningIndex(listeningIndex + 1);
                    }
                };

                runSequence();
                return () => { isCancelled = true; stopCurrentAudio(); };
            }, [listeningIndex, isPlaying, currentTab, activeVocabList, isListeningRandom]);

            const handleListeningJump = (step) => {
                setListeningIndex(prev => {
                    const len = activeVocabList.length;
                    if (len === 0) return 0;
                    let next = prev + step;
                    if (next < 0) next = (next % len + len) % len;
                    if (next >= len) next = next % len;
                    return next;
                });
            };

            const [isSpeaking, setIsSpeaking] = useState(false);
            const isSpeakingRef = React.useRef(false);
            const speakSequenceIdRef = React.useRef(0);

            const stopCurrentAudio = () => {
                speakSequenceIdRef.current++;
                isSpeakingRef.current = false;
                setIsSpeaking(false);
                if (currentAudioSourceRef.current) {
                    try {
                        currentAudioSourceRef.current.stop();
                        currentAudioSourceRef.current.disconnect();
                    } catch(e) {}
                    currentAudioSourceRef.current = null;
                }
                try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
            };

            // 👉 切換 Tab 時自動停止所有音效與考試計時器，避免跨分頁背景跳題或殘響
            useEffect(() => {
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);
                stopCurrentAudio();
            }, [currentTab]);

            const handleStopClick = () => {
                setIsPlaying(false);
                setIsStopped(true);
                stopCurrentAudio();
            };

            const handlePlayPauseClick = () => {
                getAudioCtx();
                if (!isPlaying) {
                    if (isStopped) {
                        const len = activeVocabList.length;
                        const currentAbsoluteIdx = listeningPlaylist.length > 0 ? listeningPlaylist[listeningIndex] : 0;
                        setListeningPlaylist(generatePlaylist(len, isListeningRandom, isListeningRandom ? 0 : currentAbsoluteIdx));
                        setListeningIndex(0);
                        setIsStopped(false);
                    }
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                }
            };

            // 🔊 雙層混合發音引擎：① 優先播放本地 ./audio/ MP3（Web Audio，保留 iOS 防卡死機制）
            //                      ② fetch 失敗（動態活用變化、剛新增尚未生成音檔的題目）→ 自動 fallback 瀏覽器 speechSynthesis
            const warnedFileProtocolRef = React.useRef(false);

            const ttsKeepRef = React.useRef([]); // 持有 utterance 參照，避免 Chrome 垃圾回收導致 onend 不觸發、後續無聲
            const speakTTS = (text, seq) => new Promise(resolve => {
                try {
                    if (!text || !('speechSynthesis' in window)) return resolve(false);
                    const synth = window.speechSynthesis;
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = 'ja-JP';
                    u.rate = playbackRateRef.current; // 套用側邊欄語速
                    try {
                        const jaVoice = (synth.getVoices() || []).find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith('ja'));
                        if (jaVoice) u.voice = jaVoice;
                    } catch (e) {}
                    let done = false;
                    const finish = (ok) => {
                        if (done) return; done = true;
                        clearTimeout(watchdog);
                        ttsKeepRef.current = ttsKeepRef.current.filter(x => x !== u);
                        resolve(ok);
                    };
                    // 保險：onend 若未觸發（瀏覽器 bug），依文字長度估算時間後強制結束
                    const watchdog = setTimeout(() => { try { synth.cancel(); } catch (e) {} finish(true); }, Math.max(3000, text.length * 450 / (playbackRateRef.current || 1)) + 1500);
                    u.onend = () => finish(true);
                    u.onerror = () => finish(false);
                    ttsKeepRef.current.push(u);
                    // Chrome：cancel() 後立刻 speak() 會被吞掉，需稍等再說；並先 resume() 解除卡住的暫停狀態
                    if (synth.speaking || synth.pending || synth.paused) synth.cancel();
                    setTimeout(() => {
                        if (seq !== undefined && speakSequenceIdRef.current !== seq) return finish(true);
                        try { synth.resume(); } catch (e) {}
                        synth.speak(u);
                    }, 80);
                } catch (e) { resolve(false); }
            });
            const mp3CacheRef = React.useRef(new Map());
            const fetchMp3Bytes = (url, attempts = 1) => {
                const cache = mp3CacheRef.current;
                if (cache.has(url)) return cache.get(url);
                const p = (async () => {
                    for (let attempt = 1; attempt <= attempts; attempt++) {
                        try {
                            const r = await fetch(url);
                            if (r.ok) return await r.arrayBuffer();
                            try { await r.arrayBuffer(); } catch (e) {}
                            if (r.status === 404) return null;
                        } catch (e) {}
                        if (attempt < attempts) await new Promise(r => setTimeout(r, 200));
                    }
                    cache.delete(url); // 暫時性失敗不快取，下次可重試
                    return null;
                })();
                cache.set(url, p);
                p.then(v => { if (v === null && cache.get(url) === p) cache.delete(url); });
                return p;
            };
            // 回傳 true＝MP3 成功播完；false＝找不到檔案或解碼失敗（交給 TTS）；null＝被中途取消
            const playMp3 = async (url, seq, attempts = 3) => {
                const ctx = getAudioCtx();
                try { if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 400))]); } catch (e) {}
                // 位元組快取＋去重：同一個 URL 只 fetch 一次，且「一定讀完 body」，
                // 避免被中斷的請求留下未讀完的連線佔滿瀏覽器同網域連線數（造成之後每一輪都越來越慢、最後無聲）
                // 伺服器回應過慢（>1.5 秒）時先改用 TTS 發音，MP3 仍在背景載入並快取，下次可直接播放
                const bytes = await Promise.race([fetchMp3Bytes(url, attempts), new Promise(r => setTimeout(() => r(undefined), 1500))]);
                if (bytes === undefined) return false;
                if (!bytes) {
                    if (window.location.protocol === 'file:' && !warnedFileProtocolRef.current) {
                        warnedFileProtocolRef.current = true;
                        console.warn('⚠️ 單機模式 (file://) 無法讀取音檔，已改用瀏覽器內建語音；請上傳至 GitHub Pages 以使用 MP3。');
                    }
                    return false;
                }
                if (speakSequenceIdRef.current !== seq) return null;
                try {
                    const arrayBuffer = bytes.slice(0); // decodeAudioData 會 detach 傳入的 buffer，故用複本                    // 👉 防護 2-2：強制捕捉 Safari 解碼器的同步崩潰
                    const audioBuffer = await new Promise((res, rej) => {
                        try { ctx.decodeAudioData(arrayBuffer, res, rej); }
                        catch (e) { rej(e); }
                    });
                    if (speakSequenceIdRef.current !== seq) return null;
                    await new Promise(resolve => {
                        const source = ctx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.playbackRate.value = playbackRateRef.current; // 👉 應用當前語速
                        source.connect(ctx.destination);
                        currentAudioSourceRef.current = source;
                        let finished = false;
                        const fin = () => { if (finished) return; finished = true; clearTimeout(guard); resolve(); };
                        source.onended = fin;
                        const guard = setTimeout(fin, (audioBuffer.duration / (playbackRateRef.current || 1)) * 1000 + 1500); // onended 保險
                        source.start(0);
                    });
                    return true;
                } catch (e) { console.warn(`語音播放失敗，改用 TTS: ${url}`, e); return false; }
            };

            // items: [{ url, text }]
            const playItems = async (items, attempts) => {
                getAudioCtx();
                if (isSpeakingRef.current) stopCurrentAudio();
                setIsSpeaking(true);
                isSpeakingRef.current = true;
                const currentSeq = ++speakSequenceIdRef.current;
                for (const item of items) {
                    if (speakSequenceIdRef.current !== currentSeq) break;
                    let ok = item.url ? await playMp3(item.url, currentSeq, attempts) : false;
                    if (speakSequenceIdRef.current !== currentSeq) break;
                    if (ok === false) await speakTTS(item.text, currentSeq);
                }
                if (speakSequenceIdRef.current === currentSeq) {
                    setIsSpeaking(false);
                    isSpeakingRef.current = false;
                }
            };

            const speak = async (targetWord, isFull = false) => {
                const items = [{ url: `./audio/${targetWord.id}_ja.mp3`, text: targetWord.kana || targetWord.kanji }];
                if (isFull && targetWord.example) {
                    items.push({ url: `./audio/${targetWord.id}_ex_ja.mp3`, text: targetWord.example.split(/\s*[\[(]/)[0] });
                }
                await playItems(items, 3);
            };

            // 文法例句／題目／活用變化發音：url 可為 null（動態生成的活用變化題直接走 TTS）
            const speakText = async (text, url) => {
                const clean = (text || '').replace(/【.*?】/g, '').replace(/[〇～]/g, '').trim();
                await playItems([{ url: url || null, text: clean }], 1);
            };


            // 升級統計更新邏輯，加入近 10 次歷史紀錄
            const updateStats = (id, isCorrect) => {
                setStats(prev => {
                    const s = prev[id] || { correct: 0, wrong: 0, history: [] };
                    const newHistory = [...(s.history || []), isCorrect].slice(-10);
                    return {
                        ...prev,
                        [id]: {
                            correct: s.correct + (isCorrect ? 1 : 0),
                            wrong: s.wrong + (isCorrect ? 0 : 1),
                            history: newHistory
                        }
                    };
                });
            };

            // --- 聽力測驗播放特效與邏輯 ---
            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary && examQuestions.length > 0) {
                    const word = examQuestions[examIndex].word;
                    speak(word, true); // 自動播日文單字 + 例句
                    // 預先載入下一題音檔，降低伺服器延遲影響
                    const nx = examQuestions[examIndex + 1];
                    if (nx) { fetchMp3Bytes('./audio/' + nx.word.id + '_ja.mp3'); fetchMp3Bytes('./audio/' + nx.word.id + '_ex_ja.mp3'); }
                }
            }, [examIndex, currentTab, examConfig.type, showSummary]);

            // --- 聽力測驗 10 秒計時器 ---
            const handleTimeOut = useCallback(() => {
                if (examSubmitted) return;
                const q = examQuestions[examIndex];

                setExamSubmitted(true);
                setExamAnswers({ listening: null });

                updateStats(q.word.id, false);
                setTestedWords(prev => [...prev, { word: q.word, isCorrect: false }]);
                stopCurrentAudio();

                examTimeoutRef.current = setTimeout(() => {
                    setExamSubmitted(false);
                    setExamAnswers({});
                    setIsAutoPaused(false); // 👉 重置暫停狀態
                    if (examIndex + 1 < examQuestions.length) {
                        setExamIndex(prev => prev + 1);
                        setTimeLeft(10);
                    } else {
                        finishExam();
                    }
                }, 2000);
            }, [examIndex, examQuestions, examSubmitted]);

            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary) {
                    if (examSubmitted) return;
                    if (timeLeft <= 0) {
                        handleTimeOut();
                        return;
                    }
                    const timerId = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearTimeout(timerId);
                }
            }, [timeLeft, currentTab, examConfig.type, showSummary, handleTimeOut, examSubmitted]);

            const finishExam = () => {
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);
                stopCurrentAudio();
                setShowSummary(true);
            };

            const startExam = () => {
                getAudioCtx();
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);

                if (examConfig.type === 'standard' || examConfig.type === 'typing') {
                    const hiddenCount = [examConfig.hideKanji, examConfig.hideKana, examConfig.hideMeaning].filter(Boolean).length;
                    const testCount = [examConfig.testKanji, examConfig.testKana, examConfig.testMeaning].filter(Boolean).length;
                    if (hiddenCount === 0 || hiddenCount === 3) {
                        alert("題幹隱藏欄位請選擇 1 到 2 個！");
                        return;
                    }
                    if (testCount === 0) {
                        alert("請至少選擇 1 個要測驗的項目！");
                        return;
                    }
                }

                let pool = [...currentVocabList];

                if (pool.length < 4) {
                    alert(`目前範圍的單字數量不足（僅 ${pool.length} 個單字），測驗至少需要 4 個單字！請擴大選擇級別或清除類別篩選。`);
                    return;
                }

                if (examConfig.mode === 'mistakes') {
                    // 👉 修正：改為檢查近 10 次軌跡 (history) 中是否有答錯紀錄
                    pool = pool.filter(v => {
                        const s = stats[v.id];
                        if (!s || !s.history) return false;
                        return s.history.filter(res => !res).length > 0;
                    });
                    if (pool.length < 4) { alert("近 10 次測驗內答錯的題目太少，無法進行錯題模式！(至少需4題)"); return; }
                } else if (examConfig.mode === 'favorites') {
                    pool = pool.filter(v => favoriteIds.has(v.id));
                    if (pool.length < 4) { alert("「我的最愛」單字太少！(至少需4題)"); return; }
                } else if (examConfig.mode === 'viewed') {
                    pool = pool.filter(v => viewedIds.has(v.id));
                    if (pool.length < 4) { alert("已學習單字太少！請先到學習模式瀏覽單字 (至少需4題)"); return; }
                }

                if (examConfig.mode === 'weighted') {
                    pool.sort((a, b) => {
                        const rateA = ((stats[a.id] && stats[a.id].wrong) || 0) / (((stats[a.id] && stats[a.id].correct) || 0) + ((stats[a.id] && stats[a.id].wrong) || 0) + 1);
                        const rateB = ((stats[b.id] && stats[b.id].wrong) || 0) / (((stats[b.id] && stats[b.id].correct) || 0) + ((stats[b.id] && stats[b.id].wrong) || 0) + 1);
                        return (Math.random() * (1 - rateA)) - (Math.random() * (1 - rateB));
                    });
                } else {
                    for (let i = pool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                    }
                }

                // 👉 修正：徹底杜絕 while 隨機抽取在值重複時造成的無窮死迴圈
                const generateOptions = (correctWord, field) => {
                    const options = [correctWord];
                    const usedValues = new Set([correctWord[field]]);

                    // 找出所有該欄位值相異的候選單字
                    const candidates = [];
                    const candidateValues = new Set();
                    for (const w of currentVocabList) {
                        const val = w[field];
                        if (val && !usedValues.has(val) && !candidateValues.has(val)) {
                            candidateValues.add(val);
                            candidates.push(w);
                        }
                    }

                    // 洗牌候選者
                    for (let i = candidates.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                    }

                    // 填入最多 3 個干擾項
                    for (let i = 0; i < candidates.length && options.length < 4; i++) {
                        options.push(candidates[i]);
                    }

                    // 最終選項洗牌
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    return options;
                };

                const questions = pool.map(word => ({
                    word,
                    // 👉 修正：打字模式不浪費資源計算選項；聽力測驗產生中文選項；標準模式按設定產生
                    optionsKanji: (examConfig.type === 'standard' && examConfig.testKanji) ? generateOptions(word, 'kanji') : null,
                    optionsKana: (examConfig.type === 'standard' && examConfig.testKana) ? generateOptions(word, 'kana') : null,
                    optionsMeaning: (examConfig.type === 'listening' || (examConfig.type === 'standard' && examConfig.testMeaning)) ? generateOptions(word, 'meaning') : null,
                }));

                setExamQuestions(questions);
                setExamIndex(0);
                setExamAnswers({});
                setExamSubmitted(false);
                setTestedWords([]);
                setShowSummary(false);
                setTimeLeft(10);
                setIsAutoPaused(false); // 👉 重置暫停狀態
                setCurrentTab('exam');
            };

            const submitStandardAnswer = () => {
                const q = examQuestions[examIndex];
                let isCorrect = true;

                const checkAns = (field, correctVal) => {
                    if (examConfig.type === 'typing') {
                        return (examAnswers[field] || '').trim() === correctVal;
                    } else {
                        return examAnswers[field] === correctVal;
                    }
                };

                if (examConfig.testKanji && !checkAns('kanji', q.word.kanji)) isCorrect = false;
                if (examConfig.testKana && !checkAns('kana', q.word.kana)) isCorrect = false;
                if (examConfig.testMeaning && !checkAns('meaning', q.word.meaning)) isCorrect = false;

                updateStats(q.word.id, isCorrect);
                setTestedWords(prev => {
                    if (prev.find(p => p.word.id === q.word.id)) return prev;
                    return [...prev, { word: q.word, isCorrect }];
                });
                // 👉 測驗過後，自動將該單字加入「已學習」清單
                setViewedIds(prev => {
                    const next = new Set(prev);
                    next.add(q.word.id);
                    return next;
                });
                setExamSubmitted(true);
            };

            const handleListeningAnswer = (opt) => {
                if (examSubmitted) return;
                const q = examQuestions[examIndex];
                const isCorrect = (q.word.meaning === opt);

                setExamSubmitted(true);
                setExamAnswers({ listening: opt });

                updateStats(q.word.id, isCorrect);
                setTestedWords(prev => [...prev, { word: q.word, isCorrect }]);

                // 👉 測驗過後，自動將該單字加入「已學習」清單
                setViewedIds(prev => {
                    const next = new Set(prev);
                    next.add(q.word.id);
                    return next;
                });
                stopCurrentAudio();

                examTimeoutRef.current = setTimeout(() => {
                    setExamSubmitted(false);
                    setExamAnswers({});
                    setIsAutoPaused(false);
                    if (examIndex + 1 < examQuestions.length) {
                        setExamIndex(prev => prev + 1);
                        setTimeLeft(10);
                    } else {
                        finishExam();
                    }
                }, 2000);
            };

            const exportData = () => {
                // ... 匯出邏輯省略不變
                let exportText = "// 請將此內容覆蓋對應的 vocab_NX.js\nwindow.VOCAB_DB = window.VOCAB_DB || {};\n";
                selectedLevels.forEach(level => {
                    let updatedList = window.VOCAB_DB[level].map(v => {
                        const stat = stats[v.id] || { correct: 0, wrong: 0, history: [] };
                        return {
                            ...v,
                            correct: stat.correct || 0,
                            wrong: stat.wrong || 0,
                            history: stat.history || []
                        };
                    });
                    exportText += `window.VOCAB_DB.${level} = ${JSON.stringify(updatedList, null, 4)};\n\n`;
                });
                const blob = new Blob([exportText], { type: "text/javascript;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `vocab_exported.js`;
                link.click();
            };

            if (availableLevels.length === 0) {
                return (
                    <div className="flex flex-col justify-center items-center h-screen bg-slate-50 p-6 text-center">
                        <i className="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">尚未讀取到單字庫</h2>
                        <p className="text-slate-500">請確認你有將 <b>vocab_N5.js</b> 與此頁面放在同一個資料夾，並一同推送到伺服器上。</p>
                    </div>
                );
            }

            // ☁️ GitHub 雲端同步功能 (安全過濾版)
            const FILE_NAME = 'vocab_sync.json';

            const syncToCloud = async () => {
                if (!githubToken || !gistId) {
                    alert('⚠️ 請先在側邊欄填寫 GitHub Token 與 Gist ID！');
                    return;
                }
                try {
                    // 👉 修改：手動挑選要上傳的資料，過濾掉機密 Token 與 ID
                    const dataToSync = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        // 只要不是 Token 和 ID，就加進準備上傳的物件中
                        if (key !== 'vocabGithubToken' && key !== 'vocabGistId') {
                            dataToSync[key] = localStorage.getItem(key);
                        }
                    }

                    // 將過濾後的乾淨資料轉成字串
                    const cleanData = JSON.stringify(dataToSync);

                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            files: { [FILE_NAME]: { content: cleanData } }
                        })
                    });

                    if (response.ok) alert('☁️ ✅ 學習進度已成功備份至雲端！(已安全過濾憑證)');
                    else throw new Error(`API Error: ${response.status}`);
                } catch (error) {
                    console.error('Sync failed:', error);
                    alert('❌ 上傳失敗，請檢查 Token/ID 是否正確。');
                }
            };

            const syncFromCloud = async (isAuto = false) => {
                const autoMode = isAuto === true;
                if (!githubToken || !gistId) {
                    if (!autoMode) alert('⚠️ 請先在側邊欄填寫 GitHub Token 與 Gist ID！');
                    return false;
                }
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                        }
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    const gistData = await response.json();
                    const fileContent = gistData.files[FILE_NAME].content;
                    const parsedData = JSON.parse(fileContent);

                    // 👉 新增：如果是自動同步模式，先在記憶體中比對資料是否有差異
                    if (autoMode) {
                        let isDifferent = false;
                        for (const key of Object.keys(parsedData)) {
                            if (key !== 'vocabGithubToken' && key !== 'vocabGistId') {
                                if (localStorage.getItem(key) !== parsedData[key]) {
                                    isDifferent = true;
                                    break;
                                }
                            }
                        }

                        // 如果本機資料和雲端一模一樣，就不需要更新，也不用打擾使用者
                        if (!isDifferent) {
                            return { status: 'no_update_needed' };
                        }

                        // 發現資料不同，彈出視窗詢問使用者
                        const wantSync = window.confirm('☁️ 發現雲端有不同的最新進度！\n\n是否要覆蓋目前本機的進度？\n(按「確定」載入雲端進度，按「取消」保留本機進度)');
                        if (!wantSync) {
                            return { status: 'user_cancelled' };
                        }
                    }

                    // 寫入本地 localStorage
                    Object.keys(parsedData).forEach(key => {
                        if (key !== 'vocabGithubToken' && key !== 'vocabGistId') {
                            localStorage.setItem(key, parsedData[key]);
                        }
                    });

                    // 標記本次工作階段已完成過同步，避免重新整理後又無限循環觸發
                    sessionStorage.setItem('app_synced_and_reloaded', 'true');

                    if (!autoMode) {
                        alert('📱 🎉 雲端進度已載入！畫面即將重新整理。');
                        location.reload();
                    }
                    return { status: 'success' };
                } catch (error) {
                    console.error('Download failed:', error);
                    if (!autoMode) alert('❌ 下載失敗，請確認雲端資料格式是否正確。');
                    return { status: 'error' };
                }
            };

            // 透過 sessionStorage 判斷是否剛剛才自動/手動同步並重整過
            const hasAutoSynced = sessionStorage.getItem('app_synced_and_reloaded') === 'true';
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            const handleGlobalUnlock = async () => {
                // AudioContext 必須在 click 事件當下的同步執行棧中啟動
                try {
                    const ctx = getAudioCtx();
                    const buffer = ctx.createBuffer(1, 1, 22050);
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    source.start(0);
                } catch(e) {
                    console.warn('Audio unlock failed:', e);
                }

                // 如果有設定 Token 且 本次瀏覽器工作階段尚未同步過，則執行進度檢查
                if (githubToken && gistId && !hasAutoSynced) {
                    setIsSyncing(true);
                    const result = await syncFromCloud(true);

                    if (result && result.status === 'success') {
                        // 使用者同意載入新進度且寫入成功，執行重新整理
                        location.reload();
                        return; // 中止後續執行，等待重整
                    } else if (result && (result.status === 'no_update_needed' || result.status === 'user_cancelled')) {
                        // 無需更新或使用者點擊取消，標記為已處理，進入系統
                        sessionStorage.setItem('app_synced_and_reloaded', 'true');
                    } else {
                        // 發生錯誤
                        alert('❌ 自動同步檢查失敗，直接使用本機紀錄。');
                        sessionStorage.setItem('app_synced_and_reloaded', 'true');
                    }
                }

                setIsSyncing(false);
                setIsUnlocked(true);
            };

            return (
                <React.Fragment>
                    {!isUnlocked && (
                        <div className="fixed inset-0 bg-blue-600 z-[9999] flex flex-col justify-center items-center text-white">
                            <i className="fas fa-book-reader text-6xl mb-6 drop-shadow-lg"></i>
                            <h1 className="text-3xl font-bold mb-4 drop-shadow-md">日文全方位自學</h1>
                            <p className="mb-8 text-sm opacity-90 text-center px-4">
                                {hasAutoSynced ? (
                                    <React.Fragment><i className="fas fa-check-circle mr-1"></i>雲端進度已更新，請點擊進入系統</React.Fragment>
                                ) : (githubToken && gistId ? (
                                    <React.Fragment><i className="fas fa-cloud-download-alt mr-1"></i>設定完成，按下開始將自動檢查雲端進度</React.Fragment>
                                ) : (
                                    <React.Fragment><i className="fas fa-hdd mr-1"></i>尚未設定同步，將使用本機紀錄</React.Fragment>
                                ))}
                            </p>
                            <button
                                onClick={handleGlobalUnlock}
                                disabled={isSyncing}
                                className={`px-10 py-4 text-xl rounded-full font-bold shadow-2xl transition-all flex items-center ${isSyncing ? 'bg-slate-200 text-blue-400 cursor-not-allowed' : 'bg-white text-blue-600 hover:scale-105 active:scale-95'}`}
                            >
                                {isSyncing ? <React.Fragment><i className="fas fa-spinner fa-spin mr-2"></i>檢查中...</React.Fragment> : (hasAutoSynced ? '進入系統' : '開始學習')}
                            </button>
                        </div>
                    )}

                    <div className="max-w-xl mx-auto min-h-screen flex flex-col bg-slate-50">
                        {/* 👉 新增：側邊欄 (設定與同步) */}
                        {showSidebar && (
                            <div className="fixed inset-0 bg-slate-900/60 z-50 flex justify-start backdrop-blur-sm" onClick={() => setShowSidebar(false)}>
                                <div
                                    className="bg-white w-80 h-full shadow-2xl flex flex-col transform transition-transform duration-300 translate-x-0"
                                    onClick={e => e.stopPropagation()}
                                >
                                    <div className="p-5 flex justify-between items-center border-b">
                                        <h2 className="text-lg font-bold text-slate-800"><i className="fas fa-sliders-h mr-2 text-blue-500"></i>設置與同步</h2>
                                        <button onClick={() => setShowSidebar(false)} className="text-slate-400 hover:text-slate-600 text-2xl active:scale-90 transition-transform">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>

                                    <div className="p-5 flex-1 overflow-y-auto">
                                        {/* 級別選擇 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">級別 (N1-N5)</h3>
                                            <div className="grid grid-cols-3 gap-2">
                                                {availableLevels.map(lvl => (
                                                    <label key={lvl} className={`flex justify-center items-center py-2 rounded-lg cursor-pointer text-sm font-bold border transition-all active:scale-95 ${selectedLevels.includes(lvl) ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                                        <input type="checkbox" className="hidden" checked={selectedLevels.includes(lvl)} onChange={(e) => { if(e.target.checked) setSelectedLevels([...selectedLevels, lvl]); else if(selectedLevels.length > 1) setSelectedLevels(selectedLevels.filter(l => l !== lvl)); }} />
                                                        {lvl}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 語速控制 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">語速控制</h3>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <div className="flex justify-between text-xs font-bold text-blue-600 mb-3">
                                                    <span>0.5x</span>
                                                    <span className="bg-white px-2 py-1 rounded shadow-sm border border-slate-200">目前: {playbackRate.toFixed(1)}x</span>
                                                    <span>1.5x</span>
                                                </div>
                                                <input
                                                    type="range" min="0.5" max="1.5" step="0.1"
                                                    value={playbackRate}
                                                    onChange={(e) => setPlaybackRate(parseFloat(e.target.value))}
                                                    className="w-full accent-blue-600 cursor-pointer"
                                                />
                                            </div>
                                        </div>

                                        {/* GitHub 雲端同步 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">雲端同步 (GitHub Gist API)</h3>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
                                                <div className="relative">
                                                    <input
                                                        type={showToken ? "text" : "password"}
                                                        placeholder="貼上 GitHub Token"
                                                        className="w-full p-2.5 pr-8 text-xs border rounded-lg outline-none focus:border-blue-500 shadow-sm"
                                                        value={githubToken}
                                                        onChange={(e) => {setGithubToken(e.target.value); localStorage.setItem('vocabGithubToken', e.target.value);}}
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={() => setShowToken(!showToken)}
                                                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors p-1 text-xs"
                                                        title={showToken ? "隱藏 Token" : "顯示 Token"}
                                                    >
                                                        <i className={`fas ${showToken ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                                    </button>
                                                </div>
                                                <div className="relative">
                                                    <input
                                                        type={showGistId ? "text" : "password"}
                                                        placeholder="貼上 Gist ID"
                                                        className="w-full p-2.5 pr-8 text-xs border rounded-lg outline-none focus:border-blue-500 shadow-sm"
                                                        value={gistId}
                                                        onChange={(e) => {setGistId(e.target.value); localStorage.setItem('vocabGistId', e.target.value);}}
                                                    />

                                                                const fieldTitles = { kanji: '漢字', kana: '假名', meaning: '中文' };
                                                                const title = fieldTitles[field];
                                                                const correctAns = q.word[field];
                                                                const currentVal = examAnswers[field] || '';
                                                                const isCorrect = currentVal.trim() === correctAns;

                                                                return (
                                                                    <div key={field} className="mb-2">
                                                                        <div className="text-xs font-bold text-slate-400 mb-2">輸入正確的{title}</div>
                                                                        <input
                                                                            type="text"
                                                                            value={currentVal}
                                                                            onChange={(e) => !examSubmitted && setExamAnswers({...examAnswers, [field]: e.target.value})}
                                                                            disabled={examSubmitted}
                                                                            placeholder={`請輸入${title}...`}
                                                                            className={`w-full p-4 border-2 rounded-xl outline-none font-bold text-lg transition-colors ${!examSubmitted ? 'bg-white border-slate-200 focus:border-blue-500' : (isCorrect ? 'bg-green-50 border-green-500 text-green-700' : 'bg-red-50 border-red-500 text-red-700')}`}
                                                                        />
                                                                        {examSubmitted && !isCorrect && (
                                                                            <div className="mt-2 text-sm font-bold text-green-600">正確解答：{correctAns}</div>
                                                                        )}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    )}

                                                    {examSubmitted && q.word.example && (
                                                        <div className="mt-2 text-left bg-blue-50/50 p-3 rounded-lg text-sm border border-blue-100">
                                                            <div className="flex items-center mb-1">
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); speak(q.word, true); }}
                                                                    className="mr-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                >
                                                                    <i className="fas fa-volume-up text-sm"></i>
                                                                </button>
                                                                <span className="font-bold text-blue-500 mr-2">例句</span>
                                                                <span className="text-slate-700">{q.word.example.split(' (')[0]}</span>
                                                            </div>
                                                            {q.word.example.includes('(') && (
                                                                <div className="text-slate-500 text-xs ml-9">
                                                                    ({q.word.example.split('(')[1]}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            ) : (
                                                <React.Fragment>
                                                    <div className="text-center py-6 mb-6 relative flex flex-col items-center">
                                                        {/* 👉 新增：考試中將單字加入我的最愛 (放左上角) */}
                                                        <div className="absolute top-0 left-0 z-10">
                                                            <button onClick={() => toggleFavorite(q.word.id)} className="text-2xl hover:scale-110 active:scale-95 transition-transform">
                                                                {favoriteIds.has(q.word.id) ? <i className="fas fa-heart text-red-500 drop-shadow-sm"></i> : <i className="far fa-heart text-slate-300 hover:text-red-400"></i>}
                                                            </button>
                                                        </div>

                                                        {/* 👉 移動：聽力測驗暫停自動跳轉的按鈕 (移至右上角) */}
                                                        {examSubmitted && (
                                                            <div className="absolute top-0 right-0 z-10 flex gap-2">
                                                                {!isAutoPaused ? (
                                                                    <button
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);
                                                                            setIsAutoPaused(true);
                                                                        }}
                                                                        className="px-3 py-1.5 bg-amber-50 text-amber-600 rounded-full font-bold border border-amber-200 hover:bg-amber-100 active:scale-95 transition-all shadow-sm text-xs flex items-center"
                                                                    >
                                                                        <i className="fas fa-pause mr-1"></i> 暫停跳題
                                                                    </button>
                                                                ) : (
                                                                    <button
                                                                        onClick={() => {
                                                                            setExamAnswers({});
                                                                            setExamSubmitted(false);
                                                                            setIsAutoPaused(false);
                                                                            if (examIndex + 1 < examQuestions.length) {
                                                                                setExamIndex(prev => prev + 1);
                                                                                setTimeLeft(10);
                                                                            } else {
                                                                                finishExam();
                                                                            }
                                                                        }}
                                                                        className="px-3 py-1.5 bg-blue-600 text-white rounded-full font-bold shadow-sm hover:bg-blue-700 active:scale-95 transition-all text-xs flex items-center"
                                                                    >
                                                                        {examIndex + 1 < examQuestions.length ? "下一題" : "看總結"} <i className="fas fa-chevron-right ml-1"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        )}

                                                        <i className="fas fa-headphones-alt text-6xl text-blue-500 mb-6 mt-4 animate-pulse drop-shadow-md"></i>
                                                        <div className="text-sm font-bold text-slate-500 bg-slate-50 inline-block px-4 py-2 rounded-full border border-slate-100">
                                                            請仔細聽發音，並選出正確的中文意思
                                                        </div>
                                                    </div>
                                                    <hr className="my-4 border-slate-100" />
                                                    <div className="grid grid-cols-2 gap-3 mt-auto">
                                                        {q.optionsMeaning.map((optWord, i) => {
                                                            const optValue = optWord.meaning;
                                                            let btnClass = "py-5 px-2 text-lg rounded-xl border-2 font-bold transition-all shadow-sm flex flex-col items-center justify-center gap-2 relative ";

                                                            if (!examSubmitted) {
                                                                btnClass += "bg-white text-slate-700 hover:bg-blue-50 border-slate-100 hover:border-blue-300 active:scale-95 cursor-pointer";
                                                            } else {
                                                                const isSelected = examAnswers.listening === optValue;
                                                                const isCorrectAns = q.word.meaning === optValue;

                                                                if (isCorrectAns) {
                                                                    btnClass += "bg-green-100 border-green-500 text-green-700";
                                                                } else if (isSelected && !isCorrectAns) {
                                                                    btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                                } else {
                                                                    btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                                }
                                                            }

                                                            return (
                                                                <div key={i} onClick={() => !examSubmitted && handleListeningAnswer(optValue)} className={btnClass}>
                                                                    <span className="text-center">{optValue}</span>

                                                                    {examSubmitted && (
                                                                        <div className="text-sm font-normal opacity-90 flex flex-col items-center gap-1 text-slate-600 mt-1">
                                                                            <span>{optWord.kanji}</span>
                                                                            <span className="flex items-center gap-1">{optWord.kana} {optWord.accent !== undefined && <span className="bg-black/10 px-1.5 rounded-sm text-black/60">[{optWord.accent}]</span>}</span>
                                                                        </div>
                                                                    )}

                                                                    {examSubmitted && (
                                                                        <button
                                                                            onClick={(e) => { e.stopPropagation(); speak(optWord, false); }}
                                                                            className="absolute top-2 right-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                        >
                                                                            <i className="fas fa-volume-up text-sm"></i>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {examSubmitted && q.word.example && (
                                                        <div className="mt-4 text-left bg-blue-50/50 p-3 rounded-lg text-sm border border-blue-100">
                                                            <div className="flex items-center mb-1">
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); speak(q.word, true); }}
                                                                    className="mr-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                >
                                                                    <i className="fas fa-volume-up text-sm"></i>
                                                                </button>
                                                                <span className="font-bold text-blue-500 mr-2">例句</span>
                                                                <span className="text-slate-700">{q.word.example.split(' (')[0]}</span>
                                                            </div>
                                                            {q.word.example.includes('(') && (
                                                                <div className="text-slate-500 text-xs ml-9">
                                                                    ({q.word.example.split('(')[1]}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            )}
                                        </div>

                                        {(examConfig.type === 'standard' || examConfig.type === 'typing') && (
                                            !examSubmitted ? (
                                                <button onClick={submitStandardAnswer} disabled={!allAnswered} className={`py-4 rounded-xl font-bold w-full mt-auto transition-all ${allAnswered ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                    確認答案
                                                </button>
                                            ) : (
                                                <button onClick={() => {
                                                    if (examIndex + 1 < examQuestions.length) {
                                                        setExamIndex(examIndex + 1); setExamAnswers({}); setExamSubmitted(false);
                                                    } else {
                                                        finishExam();
                                                    }
                                                }} className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg hover:bg-slate-700">
                                                    {examIndex + 1 < examQuestions.length ? "下一題" : "查看總結"}
                                                </button>
                                            )
                                        )}
                                    </div>
                                );
                            })()}

                            {currentTab.startsWith('grammar') && (
                                <GrammarModule
                                    currentTab={currentTab}
                                    setCurrentTab={setCurrentTab}
                                    selectedLevels={selectedLevels}
                                    currentVocabList={currentVocabList}
                                    stats={stats}
                                    updateStats={updateStats}
                                    favoriteIds={favoriteIds}
                                    toggleFavorite={toggleFavorite}
                                    speakText={speakText}
                                    speakWord={speak}
                                    stopCurrentAudio={stopCurrentAudio}
                                    grammarProgress={grammarProgress}
                                    setGrammarProgress={setGrammarProgress}
                                    setShowSidebar={setShowSidebar}
                                />
                            )}
                        </div>

                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
