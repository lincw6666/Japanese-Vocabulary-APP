<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文全方位自學系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 自動讀取同資料夾下的單字庫 -->
    <script src="vocab_N1.js" onerror="console.log('尚未建立 N1')"></script>
    <script src="vocab_N2.js" onerror="console.log('尚未建立 N2')"></script>
    <script src="vocab_N3.js" onerror="console.log('尚未建立 N3')"></script>
    <script src="vocab_N4.js" onerror="console.log('尚未建立 N4')"></script>
    <script src="vocab_N5.js" onerror="console.log('尚未建立 N5')"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', 'Microsoft JhengHei', sans-serif; }
        .tab-btn.active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        let globalAudioCtx = null;

        // 👉 終極解法：監聽分頁切換與背景事件，一旦離開分頁或退到背景，立刻銷毀舊引擎
        // 這能徹底避開 iOS Safari「切回分頁後硬體連線永久失效」的頑固 Bug [cite: 8, 9]
        document.addEventListener('visibilitychange', () => {
            if (globalAudioCtx) {
                try { globalAudioCtx.close(); } catch(e) {}
                globalAudioCtx = null;
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted && globalAudioCtx) {
                try { globalAudioCtx.close(); } catch(e) {}
                globalAudioCtx = null;
            }
        });

        const getAudioCtx = () => {
            // 如果 Context 不存在、已被關閉，或處於 iOS 容易卡死的 interrupted 狀態，立刻重建
            if (!globalAudioCtx || globalAudioCtx.state === 'closed' || globalAudioCtx.state === 'interrupted') {
                if (globalAudioCtx) {
                    try { globalAudioCtx.close(); } catch(e) {}
                }
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                globalAudioCtx = new AudioContext();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        };

        function App() {
            // 成績讀寫防護機制
            const loadStats = () => {
                try {
                    return JSON.parse(localStorage.getItem('vocabStats')) || {};
                } catch (e) {
                    console.warn("無法讀取本地紀錄");
                    return {};
                }
            };

            const [stats, setStats] = useState(loadStats());
            // 👉 新增：側邊欄開關與 GitHub 雲端同步狀態
            const [showSidebar, setShowSidebar] = useState(false);
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('vocabGithubToken') || '');
            const [gistId, setGistId] = useState(() => localStorage.getItem('vocabGistId') || '');

            useEffect(() => {
                try {
                    localStorage.setItem('vocabStats', JSON.stringify(stats));
                } catch (e) {
                    console.warn("無法寫入本地紀錄");
                }
            }, [stats]);

            const availableLevels = window.VOCAB_DB ? Object.keys(window.VOCAB_DB).sort() : [];

            // 👉 新增：全域語速控制與記憶
            const [playbackRate, setPlaybackRate] = useState(() => {
                const saved = localStorage.getItem('vocabPlaybackRate');
                return saved ? parseFloat(saved) : 1.0;
            });
            const playbackRateRef = React.useRef(playbackRate);
            useEffect(() => {
                playbackRateRef.current = playbackRate;
                localStorage.setItem('vocabPlaybackRate', playbackRate);
            }, [playbackRate]);

            // 👉 新增：記憶上次勾選的級別與分頁
            const [selectedLevels, setSelectedLevels] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('vocabLevels'));
                    if (saved && saved.length > 0) return saved;
                } catch(e) {}
                return availableLevels.length > 0 ? [availableLevels[availableLevels.length-1]] : [];
            });
            const [currentTab, setCurrentTab] = useState(() => localStorage.getItem('currentTab') || 'study');

            useEffect(() => localStorage.setItem('vocabLevels', JSON.stringify(selectedLevels)), [selectedLevels]);
            useEffect(() => localStorage.setItem('currentTab', currentTab), [currentTab]);

            // --- 類別篩選器狀態 (加入記憶功能) ---
            const [selectedCategories, setSelectedCategories] = useState(() => {
                try { return JSON.parse(localStorage.getItem('vocabCategories')) || []; } catch(e) { return []; }
            });
            useEffect(() => localStorage.setItem('vocabCategories', JSON.stringify(selectedCategories)), [selectedCategories]);

            const [showFilterModal, setShowFilterModal] = useState(false);

            const availableCategories = useMemo(() => {
                if (!window.VOCAB_DB) return [];
                const catSet = new Set();
                selectedLevels.forEach(level => {
                    if (window.VOCAB_DB[level]) {
                        window.VOCAB_DB[level].forEach(word => {
                            if (word.categories) {
                                word.categories.forEach(c => catSet.add(c));
                            }
                        });
                    }
                });
                return Array.from(catSet).sort();
            }, [selectedLevels]);

            const [studyIndex, setStudyIndex] = useState(0);
            // (原本用來記錄 viewedIds 的 useEffect 已被移至下方，以確保讀取到正確的錯題本清單)

            const loadViewedIds = () => {
                try {
                    const stored = JSON.parse(localStorage.getItem('viewedVocabIds'));
                    return stored ? new Set(stored) : new Set();
                } catch (e) {
                    return new Set();
                }
            };

            const [viewedIds, setViewedIds] = useState(loadViewedIds());

            useEffect(() => {
                try {
                    localStorage.setItem('viewedVocabIds', JSON.stringify(Array.from(viewedIds)));
                } catch (e) {
                    console.warn("無法寫入瀏覽紀錄");
                }
            }, [viewedIds]);

            // 👉 新增：我的最愛狀態與開關
            const [favoriteIds, setFavoriteIds] = useState(() => {
                try {
                    const stored = JSON.parse(localStorage.getItem('vocabFavorites'));
                    return stored ? new Set(stored) : new Set();
                } catch (e) { return new Set(); }
            });

            useEffect(() => {
                localStorage.setItem('vocabFavorites', JSON.stringify(Array.from(favoriteIds)));
            }, [favoriteIds]);

            const toggleFavorite = (id) => {
                setFavoriteIds(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const [isFavoritesMode, setIsFavoritesMode] = useState(() => localStorage.getItem('isFavoritesMode') === 'true');
            useEffect(() => localStorage.setItem('isFavoritesMode', isFavoritesMode), [isFavoritesMode]);

            // 👉 修正：加入學習模式各項開關的記憶功能
            const [hideKana, setHideKana] = useState(() => localStorage.getItem('hideKana') === 'true');
            const [hideKanji, setHideKanji] = useState(() => localStorage.getItem('hideKanji') === 'true');
            const [hideMeaning, setHideMeaning] = useState(() => localStorage.getItem('hideMeaning') === 'true');
            const [isRandomStudy, setIsRandomStudy] = useState(() => localStorage.getItem('isRandomStudy') === 'true');

            useEffect(() => {
                localStorage.setItem('hideKana', hideKana);
                localStorage.setItem('hideKanji', hideKanji);
                localStorage.setItem('hideMeaning', hideMeaning);
                localStorage.setItem('isRandomStudy', isRandomStudy);
            }, [hideKana, hideKanji, hideMeaning, isRandomStudy]);

            // --- 考試模式新狀態 ---
            const [examConfig, setExamConfig] = useState({
                type: 'standard',
                hideKanji: false, hideKana: true, hideMeaning: false,
                testKanji: false, testKana: true, testMeaning: false,
                mode: 'random'
            });
            const [examQuestions, setExamQuestions] = useState([]);
            const [examIndex, setExamIndex] = useState(0);
            const [examAnswers, setExamAnswers] = useState({});
            const [examSubmitted, setExamSubmitted] = useState(false);
            const [testedWords, setTestedWords] = useState([]); // 追蹤本次考試作答紀錄
            const [showSummary, setShowSummary] = useState(false); // 控制是否顯示成績總結
            const [timeLeft, setTimeLeft] = useState(10); // 聽力測驗 10 秒計時器
            const examTimeoutRef = React.useRef(null); // 控制 2 秒延遲的引用
            const [isAutoPaused, setIsAutoPaused] = useState(false); // 👉 新增：控制聽力測驗是否暫停自動跳題

            const currentVocabList = useMemo(() => {
                if (!window.VOCAB_DB) return [];
                let list = [];
                selectedLevels.forEach(level => {
                    if (window.VOCAB_DB[level]) list = list.concat(window.VOCAB_DB[level]);
                });

                if (selectedCategories.length > 0) {
                    list = list.filter(word =>
                        word.categories && word.categories.some(cat => selectedCategories.includes(cat))
                    );
                }
                return list;
            }, [selectedLevels, selectedCategories]);

            // 👉 修正：錯題本模式狀態加入記憶功能
            const [isReviewMistakesMode, setIsReviewMistakesMode] = useState(() => localStorage.getItem('isReviewMistakesMode') === 'true');
            useEffect(() => localStorage.setItem('isReviewMistakesMode', isReviewMistakesMode), [isReviewMistakesMode]);

            // 👉 新增：套用「我的最愛」過濾後的作用中列表
            const activeVocabList = useMemo(() => {
                if (isFavoritesMode) return currentVocabList.filter(w => favoriteIds.has(w.id));
                return currentVocabList;
            }, [currentVocabList, isFavoritesMode, favoriteIds]);

            // 👉 修改：學習模式改為基於 activeVocabList
            const studyVocabList = useMemo(() => {
                if (!isReviewMistakesMode) return activeVocabList;

                return [...activeVocabList].filter(word => {
                    const s = stats[word.id];
                    if (!s || !s.history) return false;
                    return s.history.filter(res => !res).length > 0; // 近 10 次內有錯過才顯示
                }).sort((a, b) => {
                    const countA = stats[a.id].history ? stats[a.id].history.filter(res => !res).length : 0;
                    const countB = stats[b.id].history ? stats[b.id].history.filter(res => !res).length : 0;
                    if (countB !== countA) return countB - countA; // 首要條件：近 10 次錯越多次排越前面

                    // 次要條件：若近 10 次錯一樣多，則比較有史以來總錯誤次數
                    const totalA = stats[a.id].wrong || 0;
                    const totalB = stats[b.id].wrong || 0;
                    return totalB - totalA;
                });
            }, [activeVocabList, isReviewMistakesMode, stats]);

            // 👉 升級：動態產生當前列表組合的「複合鍵」
            const getStudyConditionKey = useCallback(() => {
                return `lvl:${selectedLevels.join(',')}_cat:${selectedCategories.join(',')}_fav:${isFavoritesMode}_err:${isReviewMistakesMode}`;
            }, [selectedLevels, selectedCategories, isFavoritesMode, isReviewMistakesMode]);

            // 👉 升級：讀取並記憶學習模式進度 (使用 Progress Map 與 Anchor ID)
            useEffect(() => {
                if (studyVocabList.length > 0) {
                    const conditionKey = getStudyConditionKey();
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('studyProgressMap')) || {};
                        const savedAnchorId = savedMap[conditionKey];
                        // 利用 Anchor ID 動態尋找單字在當前陣列的新位置
                        if (savedAnchorId) {
                            const targetIdx = studyVocabList.findIndex(w => w.id === savedAnchorId);
                            setStudyIndex(targetIdx !== -1 ? targetIdx : 0);
                            return;
                        }
                    } catch (e) {}
                    setStudyIndex(0);
                }
            }, [studyVocabList, getStudyConditionKey]);

            // 👉 升級：自動儲存學習模式進度至 Progress Map
            useEffect(() => {
                if (studyVocabList.length > 0 && studyVocabList[studyIndex]) {
                    const conditionKey = getStudyConditionKey();
                    const currentWordId = studyVocabList[studyIndex].id; // 儲存單字 ID 作為錨點
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('studyProgressMap')) || {};
                        savedMap[conditionKey] = currentWordId;
                        localStorage.setItem('studyProgressMap', JSON.stringify(savedMap));
                    } catch (e) {}
                }
            }, [studyIndex, studyVocabList, getStudyConditionKey]);

            // 👉 新增：正確記錄「學習模式」當下看過的單字
            useEffect(() => {
                if (currentTab === 'study' && studyVocabList.length > 0 && studyVocabList[studyIndex]) {
                    setViewedIds(prev => {
                        const next = new Set(prev);
                        next.add(studyVocabList[studyIndex].id);
                        return next;
                    });
                }
            }, [studyIndex, studyVocabList, currentTab]);

            const [listeningIndex, setListeningIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isStopped, setIsStopped] = useState(true);
            const [isListeningRandom, setIsListeningRandom] = useState(false);
            const [isListeningLoop, setIsListeningLoop] = useState(false);
            const [listeningPlaylist, setListeningPlaylist] = useState([]);

            const isListeningLoopRef = React.useRef(isListeningLoop);
            isListeningLoopRef.current = isListeningLoop;
            const isListeningRandomRef = React.useRef(isListeningRandom);
            isListeningRandomRef.current = isListeningRandom;

            const generatePlaylist = (length, isRandom, startIndex = 0) => {
                let list = Array.from({length}, (_, i) => i);
                if (isRandom) {
                    for (let i = list.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [list[i], list[j]] = [list[j], list[i]];
                    }
                } else {
                    if (startIndex > 0 && startIndex < length) {
                        list = [...list.slice(startIndex), ...list.slice(0, startIndex)];
                    }
                }
                return list;
            };

            // 👉 升級：動態產生聽力列表組合的「複合鍵」
            const getListeningConditionKey = useCallback(() => {
                return `lvl:${selectedLevels.join(',')}_cat:${selectedCategories.join(',')}_fav:${isFavoritesMode}`;
            }, [selectedLevels, selectedCategories, isFavoritesMode]);

            useEffect(() => {
                const len = activeVocabList.length;
                if (len > 0) {
                    const conditionKey = getListeningConditionKey();
                    const vocabKey = `${len}_${activeVocabList[0].id}_${activeVocabList[len-1].id}`;
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('listeningProgressMap')) || {};
                        const saved = savedMap[conditionKey];

                        // 確保單字庫沒有因為外部vocab檔案變更而大改
                        if (saved && saved.vocabKey === vocabKey) {
                            setListeningPlaylist(saved.playlist);
                            setListeningIndex(saved.index < len ? saved.index : 0);
                            setIsListeningRandom(!!saved.random);
                            setIsListeningLoop(!!saved.loop);
                            setIsStopped(true);
                            setIsPlaying(false);
                            return;
                        }
                    } catch (e) {}

                    setListeningPlaylist(generatePlaylist(len, isListeningRandomRef.current, 0));
                    setListeningIndex(0);
                    setIsStopped(true);
                    setIsPlaying(false);
                } else {
                    setListeningPlaylist([]);
                }
            }, [activeVocabList, getListeningConditionKey]);

            // 👉 升級：自動儲存聽力模式進度至 Progress Map
            useEffect(() => {
                if (activeVocabList.length > 0 && listeningPlaylist.length > 0) {
                    const conditionKey = getListeningConditionKey();
                    const vocabKey = `${activeVocabList.length}_${activeVocabList[0].id}_${activeVocabList[activeVocabList.length-1].id}`;
                    try {
                        const savedMap = JSON.parse(localStorage.getItem('listeningProgressMap')) || {};
                        savedMap[conditionKey] = {
                            vocabKey,
                            playlist: listeningPlaylist,
                            index: listeningIndex,
                            random: isListeningRandom,
                            loop: isListeningLoop
                        };
                        localStorage.setItem('listeningProgressMap', JSON.stringify(savedMap));
                    } catch (e) {}
                }
            }, [listeningIndex, listeningPlaylist, isListeningRandom, isListeningLoop, activeVocabList, getListeningConditionKey]);

            const currentAudioSourceRef = React.useRef(null);
            const sequenceIdRef = React.useRef(0);

            useEffect(() => {
                if (currentTab !== 'listening' || !isPlaying || activeVocabList.length === 0 || listeningPlaylist.length === 0) {
                    stopCurrentAudio();
                    sequenceIdRef.current++;
                    return;
                }

                let isCancelled = false;
                const seqId = ++sequenceIdRef.current;
                const word = activeVocabList[listeningPlaylist[listeningIndex]];

                if (!word) return; // 👉 關鍵防呆：避免切換瞬間陣列尚未同步導致 crash

                const runSequence = async () => {
                    const items = [
                        { url: `./audio/${word.id}_ja.mp3`, delay: 500 },
                        { url: `./audio/${word.id}_ja.mp3`, delay: 800 },
                        { url: `./audio/${word.id}_zh.mp3`, delay: 1000 }
                    ];

                    if (word.example) {
                        items.push({ url: `./audio/${word.id}_ex_ja.mp3`, delay: 1200 });
                        if (word.example.includes('(')) {
                            items.push({ url: `./audio/${word.id}_ex_zh.mp3`, delay: 800 });
                        }
                    }

                    for (let item of items) {
                        if (isCancelled || sequenceIdRef.current !== seqId) return;
                        if (item.delay) await new Promise(r => setTimeout(r, item.delay));
                        if (isCancelled || sequenceIdRef.current !== seqId) return;

                        const playLocalFile = async (url) => {
                            try {
                                if (isCancelled || sequenceIdRef.current !== seqId) return;
                                const ctx = getAudioCtx();

                                let response = null;
                                let fetchSuccess = false;
                                for (let attempt = 1; attempt <= 3; attempt++) {
                                    try {
                                        response = await fetch(url);
                                        if (response.ok) { fetchSuccess = true; break; }
                                    } catch (e) {
                                        if (attempt === 3) break;
                                        await new Promise(r => setTimeout(r, 200));
                                    }
                                }

                                if (!fetchSuccess) {
                                    if (window.location.protocol === 'file:') {
                                        alert("⚠️ Safari 安全限制警告\n\niOS Safari 嚴格禁止在單機模式 (file://) 下讀取音檔。\n請上傳至 GitHub Pages 上測試。");
                                        setIsPlaying(false);
                                        setIsStopped(true);
                                    }
                                    return;
                                }

                                const arrayBuffer = await response.arrayBuffer();
                                // 👉 防護 2-1：強制捕捉 Safari 解碼器的同步崩潰
                                const audioBuffer = await new Promise((res, rej) => {
                                    try { ctx.decodeAudioData(arrayBuffer, res, rej); }
                                    catch (e) { rej(e); }
                                });
                                if (isCancelled || sequenceIdRef.current !== seqId) return;

                                await new Promise((resolve) => {
                                    const source = ctx.createBufferSource();
                                    source.buffer = audioBuffer;
                                    source.playbackRate.value = playbackRateRef.current; // 👉 應用當前語速
                                    source.connect(ctx.destination);
                                    currentAudioSourceRef.current = source;
                                    source.onended = () => { currentAudioSourceRef.current = null; resolve(); };
                                    source.start(0);
                                });
                            } catch (error) {}
                        };
                        await playLocalFile(item.url);
                    }

                    if (isCancelled || sequenceIdRef.current !== seqId) return;
                    await new Promise(r => setTimeout(r, 1500));
                    if (isCancelled || sequenceIdRef.current !== seqId) return;

                    const len = activeVocabList.length;
                    if (listeningIndex + 1 >= len) {
                        if (!isListeningLoopRef.current) {
                            setIsPlaying(false); setIsStopped(true);
                        } else {
                            if (isListeningRandomRef.current) setListeningPlaylist(generatePlaylist(len, true));
                            setListeningIndex(0);
                        }
                    } else {
                        setListeningIndex(listeningIndex + 1);
                    }
                };

                runSequence();
                return () => { isCancelled = true; stopCurrentAudio(); };
            }, [listeningIndex, isPlaying, currentTab, activeVocabList, isListeningRandom]);

            const handleListeningJump = (step) => {
                setListeningIndex(prev => {
                    const len = activeVocabList.length;
                    if (len === 0) return 0;
                    let next = prev + step;
                    if (next < 0) next = (next % len + len) % len;
                    if (next >= len) next = next % len;
                    return next;
                });
            };

            const [isSpeaking, setIsSpeaking] = useState(false);
            const isSpeakingRef = React.useRef(false);
            const speakSequenceIdRef = React.useRef(0);

            const stopCurrentAudio = () => {
                isSpeakingRef.current = false;
                setIsSpeaking(false);
                if (currentAudioSourceRef.current) {
                    try {
                        currentAudioSourceRef.current.stop();
                        currentAudioSourceRef.current.disconnect();
                    } catch(e) {}
                    currentAudioSourceRef.current = null;
                }
            };

            const handleStopClick = () => {
                setIsPlaying(false);
                setIsStopped(true);
                stopCurrentAudio();
            };

            const handlePlayPauseClick = () => {
                getAudioCtx();
                if (!isPlaying) {
                    if (isStopped) {
                        const len = activeVocabList.length;
                        const currentAbsoluteIdx = listeningPlaylist.length > 0 ? listeningPlaylist[listeningIndex] : 0;
                        setListeningPlaylist(generatePlaylist(len, isListeningRandom, isListeningRandom ? 0 : currentAbsoluteIdx));
                        setListeningIndex(0);
                        setIsStopped(false);
                    }
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                }
            };

            const speak = async (targetWord, isFull = false) => {
                const ctx = getAudioCtx();
                if (isSpeakingRef.current) stopCurrentAudio();

                setIsSpeaking(true);
                isSpeakingRef.current = true;
                const currentSeq = ++speakSequenceIdRef.current;

                const playQueue = [`./audio/${targetWord.id}_ja.mp3`];
                if (isFull && targetWord.example) playQueue.push(`./audio/${targetWord.id}_ex_ja.mp3`);

                for (const url of playQueue) {
                    if (speakSequenceIdRef.current !== currentSeq) break;
                    try {
                        let response = null; let fetchSuccess = false;
                        for (let attempt = 1; attempt <= 3; attempt++) {
                            try { response = await fetch(url); if (response.ok) { fetchSuccess = true; break; } }
                            catch (e) { if (attempt === 3) break; await new Promise(r => setTimeout(r, 200)); }
                        }
                        if (!fetchSuccess) {
                            if (window.location.protocol === 'file:') {
                                alert("⚠️ Safari 安全限制警告\n\niOS Safari 嚴格禁止在單機模式 (file://) 下讀取音檔。\n請上傳至 GitHub Pages 上測試。");
                                break;
                            }
                            continue;
                        }

                        const arrayBuffer = await response.arrayBuffer();
                        // 👉 防護 2-2：強制捕捉 Safari 解碼器的同步崩潰
                        const audioBuffer = await new Promise((res, rej) => {
                            try { ctx.decodeAudioData(arrayBuffer, res, rej); }
                            catch (e) { rej(e); }
                        });
                        if (speakSequenceIdRef.current !== currentSeq) break;

                        await new Promise(resolve => {
                            const source = ctx.createBufferSource();
                            source.buffer = audioBuffer;
                            source.playbackRate.value = playbackRateRef.current; // 👉 應用當前語速
                            source.connect(ctx.destination);
                            currentAudioSourceRef.current = source;
                            source.onended = resolve;
                            source.start(0);
                        });
                    } catch (e) { console.warn(`語音播放失敗略過: ${url}`, e); }
                }

                if (speakSequenceIdRef.current === currentSeq) {
                    setIsSpeaking(false);
                    isSpeakingRef.current = false;
                }
            };

            // 升級統計更新邏輯，加入近 10 次歷史紀錄
            const updateStats = (id, isCorrect) => {
                setStats(prev => {
                    const s = prev[id] || { correct: 0, wrong: 0, history: [] };
                    const newHistory = [...(s.history || []), isCorrect].slice(-10);
                    return {
                        ...prev,
                        [id]: {
                            correct: s.correct + (isCorrect ? 1 : 0),
                            wrong: s.wrong + (isCorrect ? 0 : 1),
                            history: newHistory
                        }
                    };
                });
            };

            // --- 聽力測驗播放特效與邏輯 ---
            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary && examQuestions.length > 0) {
                    const word = examQuestions[examIndex].word;
                    speak(word, true); // 自動播日文單字 + 例句
                }
            }, [examIndex, currentTab, examConfig.type, showSummary]);

            // --- 聽力測驗 10 秒計時器 ---
            const handleTimeOut = useCallback(() => {
                if (examSubmitted) return;
                const q = examQuestions[examIndex];

                setExamSubmitted(true);
                setExamAnswers({ listening: null });

                updateStats(q.word.id, false);
                setTestedWords(prev => [...prev, { word: q.word, isCorrect: false }]);
                stopCurrentAudio();

                examTimeoutRef.current = setTimeout(() => {
                    setExamSubmitted(false);
                    setExamAnswers({});
                    setIsAutoPaused(false); // 👉 重置暫停狀態
                    if (examIndex + 1 < examQuestions.length) {
                        setExamIndex(prev => prev + 1);
                        setTimeLeft(10);
                    } else {
                        finishExam();
                    }
                }, 2000);
            }, [examIndex, examQuestions, examSubmitted]);

            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary) {
                    if (examSubmitted) return;
                    if (timeLeft <= 0) {
                        handleTimeOut();
                        return;
                    }
                    const timerId = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearTimeout(timerId);
                }
            }, [timeLeft, currentTab, examConfig.type, showSummary, handleTimeOut, examSubmitted]);

            const finishExam = () => {
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);
                stopCurrentAudio();
                setShowSummary(true);
            };

            const startExam = () => {
                getAudioCtx();
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);

                if (examConfig.type === 'standard') {
                    const hiddenCount = [examConfig.hideKanji, examConfig.hideKana, examConfig.hideMeaning].filter(Boolean).length;
                    const testCount = [examConfig.testKanji, examConfig.testKana, examConfig.testMeaning].filter(Boolean).length;
                    if (hiddenCount === 0 || hiddenCount === 3) {
                        alert("題幹隱藏欄位請選擇 1 到 2 個！");
                        return;
                    }
                    if (testCount === 0) {
                        alert("請至少選擇 1 個要測驗的項目！");
                        return;
                    }
                }

                let pool = [...currentVocabList];

                if (examConfig.mode === 'mistakes') {
                    // 👉 修正：改為檢查近 10 次軌跡 (history) 中是否有答錯紀錄
                    pool = pool.filter(v => {
                        const s = stats[v.id];
                        if (!s || !s.history) return false;
                        return s.history.filter(res => !res).length > 0;
                    });
                    if (pool.length < 4) { alert("近 10 次測驗內答錯的題目太少，無法進行錯題模式！(至少需4題)"); return; }
                } else if (examConfig.mode === 'favorites') {
                    pool = pool.filter(v => favoriteIds.has(v.id));
                    if (pool.length < 4) { alert("「我的最愛」單字太少！(至少需4題)"); return; }
                } else if (examConfig.mode === 'viewed') {
                    pool = pool.filter(v => viewedIds.has(v.id));
                    if (pool.length < 4) { alert("已學習單字太少！請先到學習模式瀏覽單字 (至少需4題)"); return; }
                }

                if (examConfig.mode === 'weighted') {
                    pool.sort((a, b) => {
                        const rateA = ((stats[a.id] && stats[a.id].wrong) || 0) / (((stats[a.id] && stats[a.id].correct) || 0) + ((stats[a.id] && stats[a.id].wrong) || 0) + 1);
                        const rateB = ((stats[b.id] && stats[b.id].wrong) || 0) / (((stats[b.id] && stats[b.id].correct) || 0) + ((stats[b.id] && stats[b.id].wrong) || 0) + 1);
                        return (Math.random() * (1 - rateA)) - (Math.random() * (1 - rateB));
                    });
                } else {
                    for (let i = pool.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [pool[i], pool[j]] = [pool[j], pool[i]];
                    }
                }

                const generateOptions = (correctWord, field) => {
                    const options = [correctWord];
                    const usedValues = new Set([correctWord[field]]);

                    while(options.length < 4 && options.length < currentVocabList.length) {
                        const randomWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
                        if (!usedValues.has(randomWord[field])) {
                            options.push(randomWord);
                            usedValues.add(randomWord[field]);
                        }
                    }

                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    return options;
                };

                const questions = pool.map(word => ({
                    word,
                    // 👉 修正：聽力測驗取消產生漢字選項，改為產生中文(Meaning)選項
                    optionsKanji: (examConfig.type !== 'listening' && examConfig.testKanji) ? generateOptions(word, 'kanji') : null,
                    optionsKana: (examConfig.type !== 'listening' && examConfig.testKana) ? generateOptions(word, 'kana') : null,
                    optionsMeaning: (examConfig.type === 'listening' || examConfig.testMeaning) ? generateOptions(word, 'meaning') : null,
                }));

                setExamQuestions(questions);
                setExamIndex(0);
                setExamAnswers({});
                setExamSubmitted(false);
                setTestedWords([]);
                setShowSummary(false);
                setTimeLeft(10);
                setIsAutoPaused(false); // 👉 重置暫停狀態
                setCurrentTab('exam');
            };

            const submitStandardAnswer = () => {
                const q = examQuestions[examIndex];
                let isCorrect = true;
                if (examConfig.testKanji && examAnswers.kanji !== q.word.kanji) isCorrect = false;
                if (examConfig.testKana && examAnswers.kana !== q.word.kana) isCorrect = false;
                if (examConfig.testMeaning && examAnswers.meaning !== q.word.meaning) isCorrect = false;

                updateStats(q.word.id, isCorrect);
                setTestedWords(prev => {
                    if (prev.find(p => p.word.id === q.word.id)) return prev;
                    return [...prev, { word: q.word, isCorrect }];
                });
                // 👉 測驗過後，自動將該單字加入「已學習」清單
                setViewedIds(prev => {
                    const next = new Set(prev);
                    next.add(q.word.id);
                    return next;
                });
                setExamSubmitted(true);
            };

            const handleListeningAnswer = (opt) => {
                if (examSubmitted) return;
                const q = examQuestions[examIndex];
                const isCorrect = (q.word.meaning === opt);

                setExamSubmitted(true);
                setExamAnswers({ listening: opt });

                updateStats(q.word.id, isCorrect);
                setTestedWords(prev => [...prev, { word: q.word, isCorrect }]);

                // 👉 測驗過後，自動將該單字加入「已學習」清單
                setViewedIds(prev => {
                    const next = new Set(prev);
                    next.add(q.word.id);
                    return next;
                });
                stopCurrentAudio();

                examTimeoutRef.current = setTimeout(() => {
                    setExamSubmitted(false);
                    setExamAnswers({});
                    setIsAutoPaused(false);
                    if (examIndex + 1 < examQuestions.length) {
                        setExamIndex(prev => prev + 1);
                        setTimeLeft(10);
                    } else {
                        finishExam();
                    }
                }, 2000);
            };

            const exportData = () => {
                // ... 匯出邏輯省略不變
                let exportText = "// 請將此內容覆蓋對應的 vocab_NX.js\nwindow.VOCAB_DB = window.VOCAB_DB || {};\n";
                selectedLevels.forEach(level => {
                    let updatedList = window.VOCAB_DB[level].map(v => {
                        const stat = stats[v.id] || { correct: 0, wrong: 0, history: [] };
                        return {
                            ...v,
                            correct: stat.correct || 0,
                            wrong: stat.wrong || 0,
                            history: stat.history || []
                        };
                    });
                    exportText += `window.VOCAB_DB.${level} = ${JSON.stringify(updatedList, null, 4)};\n\n`;
                });
                const blob = new Blob([exportText], { type: "text/javascript;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `vocab_exported.js`;
                link.click();
            };

            if (availableLevels.length === 0) {
                return (
                    <div className="flex flex-col justify-center items-center h-screen bg-slate-50 p-6 text-center">
                        <i className="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">尚未讀取到單字庫</h2>
                        <p className="text-slate-500">請確認你有將 <b>vocab_N5.js</b> 與此頁面放在同一個資料夾，並一同推送到伺服器上。</p>
                    </div>
                );
            }

            // ☁️ GitHub 雲端同步功能 (安全過濾版)
            const FILE_NAME = 'vocab_sync.json';

            const syncToCloud = async () => {
                if (!githubToken || !gistId) {
                    alert('⚠️ 請先在側邊欄填寫 GitHub Token 與 Gist ID！');
                    return;
                }
                try {
                    // 👉 修改：手動挑選要上傳的資料，過濾掉機密 Token 與 ID
                    const dataToSync = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        // 只要不是 Token 和 ID，就加進準備上傳的物件中
                        if (key !== 'vocabGithubToken' && key !== 'vocabGistId') {
                            dataToSync[key] = localStorage.getItem(key);
                        }
                    }

                    // 將過濾後的乾淨資料轉成字串
                    const cleanData = JSON.stringify(dataToSync);

                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            files: { [FILE_NAME]: { content: cleanData } }
                        })
                    });

                    if (response.ok) alert('☁️ ✅ 學習進度已成功備份至雲端！(已安全過濾憑證)');
                    else throw new Error(`API Error: ${response.status}`);
                } catch (error) {
                    console.error('Sync failed:', error);
                    alert('❌ 上傳失敗，請檢查 Token/ID 是否正確。');
                }
            };

            const syncFromCloud = async () => {
                if (!githubToken || !gistId) {
                    alert('⚠️ 請先在側邊欄填寫 GitHub Token 與 Gist ID！');
                    return;
                }
                try {
                    const response = await fetch(`https://api.github.com/gists/${gistId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                        }
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    const gistData = await response.json();
                    const fileContent = gistData.files[FILE_NAME].content;

                    const parsedData = JSON.parse(fileContent);

                    // 👉 修改：雙重保險，寫入本地時再次確認不會覆蓋掉憑證
                    Object.keys(parsedData).forEach(key => {
                        if (key !== 'vocabGithubToken' && key !== 'vocabGistId') {
                            localStorage.setItem(key, parsedData[key]);
                        }
                    });

                    alert('📱 🎉 雲端進度已載入！畫面即將重新整理。');
                    location.reload();
                } catch (error) {
                    console.error('Download failed:', error);
                    alert('❌ 下載失敗，請確認雲端是否有資料或 ID 是否正確。');
                }
            };

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const [isUnlocked, setIsUnlocked] = useState(!isIOS);

            const handleGlobalUnlock = () => {
                const ctx = getAudioCtx(); // 同步喚醒，不使用 await
                const buffer = ctx.createBuffer(1, 1, 22050);
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(0);
                setIsUnlocked(true);
            };

            return (
                <React.Fragment>
                    {isIOS && !isUnlocked && (
                        <div style={{ position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', backgroundColor: '#2563eb', zIndex: 9999, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', color: 'white' }}>
                            <h1 style={{ marginBottom: '20px' }}>歡迎開始學習</h1>
                            <button onClick={handleGlobalUnlock} style={{ padding: '20px 40px', fontSize: '20px', borderRadius: '50px', border: 'none', background: 'white', color: '#2563eb', fontWeight: 'bold' }}>點擊此處開始</button>
                        </div>
                    )}

                    <div className="max-w-xl mx-auto min-h-screen flex flex-col bg-slate-50">
                        {/* 👉 新增：側邊欄 (設定與同步) */}
                        {showSidebar && (
                            <div className="fixed inset-0 bg-slate-900/60 z-50 flex justify-start backdrop-blur-sm" onClick={() => setShowSidebar(false)}>
                                <div
                                    className="bg-white w-80 h-full shadow-2xl flex flex-col transform transition-transform duration-300 translate-x-0"
                                    onClick={e => e.stopPropagation()}
                                >
                                    <div className="p-5 flex justify-between items-center border-b">
                                        <h2 className="text-lg font-bold text-slate-800"><i className="fas fa-sliders-h mr-2 text-blue-500"></i>設置與同步</h2>
                                        <button onClick={() => setShowSidebar(false)} className="text-slate-400 hover:text-slate-600 text-2xl active:scale-90 transition-transform">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>

                                    <div className="p-5 flex-1 overflow-y-auto">
                                        {/* 級別選擇 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">級別 (N1-N5)</h3>
                                            <div className="grid grid-cols-3 gap-2">
                                                {availableLevels.map(lvl => (
                                                    <label key={lvl} className={`flex justify-center items-center py-2 rounded-lg cursor-pointer text-sm font-bold border transition-all active:scale-95 ${selectedLevels.includes(lvl) ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-sm' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                                        <input type="checkbox" className="hidden" checked={selectedLevels.includes(lvl)} onChange={(e) => { if(e.target.checked) setSelectedLevels([...selectedLevels, lvl]); else if(selectedLevels.length > 1) setSelectedLevels(selectedLevels.filter(l => l !== lvl)); }} />
                                                        {lvl}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 語速控制 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">語速控制</h3>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <div className="flex justify-between text-xs font-bold text-blue-600 mb-3">
                                                    <span>0.5x</span>
                                                    <span className="bg-white px-2 py-1 rounded shadow-sm border border-slate-200">目前: {playbackRate.toFixed(1)}x</span>
                                                    <span>1.5x</span>
                                                </div>
                                                <input
                                                    type="range" min="0.5" max="1.5" step="0.1"
                                                    value={playbackRate}
                                                    onChange={(e) => setPlaybackRate(parseFloat(e.target.value))}
                                                    className="w-full accent-blue-600 cursor-pointer"
                                                />
                                            </div>
                                        </div>

                                        {/* GitHub 雲端同步 */}
                                        <div className="mb-8">
                                            <h3 className="text-sm font-bold text-slate-500 mb-3">雲端同步 (GitHub Gist API)</h3>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col gap-3">
                                                <input
                                                    type="text"
                                                    placeholder="貼上 GitHub Token"
                                                    className="w-full p-2.5 text-xs border rounded-lg outline-none focus:border-blue-500 shadow-sm"
                                                    value={githubToken}
                                                    onChange={(e) => {setGithubToken(e.target.value); localStorage.setItem('vocabGithubToken', e.target.value);}}
                                                />
                                                <input
                                                    type="text"
                                                    placeholder="貼上 Gist ID"
                                                    className="w-full p-2.5 text-xs border rounded-lg outline-none focus:border-blue-500 shadow-sm"
                                                    value={gistId}
                                                    onChange={(e) => {setGistId(e.target.value); localStorage.setItem('vocabGistId', e.target.value);}}
                                                />
                                                <div className="grid grid-cols-2 gap-2 mt-2">
                                                    <button onClick={syncToCloud} className="bg-blue-600 text-white text-xs font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 active:scale-95 transition-all flex items-center justify-center">
                                                        <i className="fas fa-cloud-upload-alt mr-1"></i>上傳進度
                                                    </button>
                                                    <button onClick={syncFromCloud} className="bg-slate-700 text-white text-xs font-bold py-3 rounded-lg shadow-md hover:bg-slate-800 active:scale-95 transition-all flex items-center justify-center">
                                                        <i className="fas fa-cloud-download-alt mr-1"></i>下載進度
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div className="bg-white shadow-sm sticky top-0 z-10">
                            <div className="p-4 flex justify-between items-center">
                                <h1 className="text-xl font-bold text-slate-800">日文全方位自學 <span className="text-xs text-slate-400 font-normal">v4.10</span></h1>
                                <button onClick={exportData} className="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded text-slate-700">
                                    <i className="fas fa-download mr-1"></i>匯出紀錄
                                </button>
                            </div>

                            {/* 👉 修改：加入側邊欄按鈕，並重新排列 Tab */}
                            <div className="flex border-t items-stretch bg-slate-50">
                                <button
                                    onClick={() => setShowSidebar(true)}
                                    className="w-14 flex-shrink-0 bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition-colors shadow-inner"
                                >
                                    <i className="fas fa-cog text-xl"></i>
                                </button>
                                <button onClick={() => setCurrentTab('study')} className={`flex-1 py-3 text-sm tab-btn ${currentTab === 'study' ? 'active bg-white' : 'text-slate-500'}`}>學習模式</button>
                                <button onClick={() => setCurrentTab('listening')} className={`flex-1 py-3 text-sm tab-btn ${currentTab === 'listening' ? 'active bg-white' : 'text-slate-500'}`}>聽力模式</button>
                                <button onClick={() => setCurrentTab('exam_setup')} className={`flex-1 py-3 text-sm tab-btn ${currentTab.startsWith('exam') ? 'active bg-white' : 'text-slate-500'}`}>考試模式</button>
                            </div>
                        </div>

                        <button
                            onClick={() => setShowFilterModal(true)}
                            className="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-105 active:scale-95 transition-all z-40 border-2 border-white"
                        >
                            <i className="fas fa-filter"></i>
                            {selectedCategories.length > 0 && (
                                <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
                                    {selectedCategories.length}
                                </span>
                            )}
                        </button>

                        {showFilterModal && (
                            <div className="fixed inset-0 bg-slate-900/60 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
                                <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl relative">
                                    <button onClick={() => setShowFilterModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 active:scale-90 transition-transform">
                                        <i className="fas fa-times text-2xl"></i>
                                    </button>

                                    <h2 className="text-xl font-bold mb-2 text-slate-800">
                                        <i className="fas fa-tags mr-2 text-blue-500"></i>單字類別篩選
                                    </h2>
                                    <p className="text-xs text-slate-500 mb-5">
                                        {selectedCategories.length === 0
                                            ? "目前未套用篩選，將顯示所選級別的所有單字。"
                                            : "目前僅顯示符合以下勾選類別的單字。"}
                                    </p>

                                    <div className="grid grid-cols-3 gap-2 max-h-[50vh] overflow-y-auto p-1">
                                        {availableCategories.length === 0 ? (
                                            <div className="col-span-3 text-center text-slate-400 text-sm py-4">
                                                目前選取的級別中尚未有分類標籤的單字。
                                            </div>
                                        ) : (
                                            availableCategories.map(cat => (
                                                <label key={cat} className={`flex flex-col items-center justify-center py-3 px-1 border rounded-xl cursor-pointer text-sm font-bold transition-all active:scale-95 ${selectedCategories.includes(cat) ? 'bg-blue-100 border-blue-500 text-blue-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}>
                                                    <input type="checkbox" className="hidden"
