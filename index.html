<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文全方位自學系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自動讀取同資料夾下的單字庫 (找不到檔案時會在背景略過，不會當機) -->
    <script src="vocab_N1.js" onerror="console.log('尚未建立 N1')"></script>
    <script src="vocab_N2.js" onerror="console.log('尚未建立 N2')"></script>
    <script src="vocab_N3.js" onerror="console.log('尚未建立 N3')"></script>
    <script src="vocab_N4.js" onerror="console.log('尚未建立 N4')"></script>
    <script src="vocab_N5.js" onerror="console.log('尚未建立 N5')"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', 'Microsoft JhengHei', sans-serif; }
        .tab-btn.active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // 成績讀寫防護機制
            const loadStats = () => {
                try {
                    return JSON.parse(localStorage.getItem('vocabStats')) || {};
                } catch (e) {
                    console.warn("無法讀取本地紀錄");
                    return {};
                }
            };
            
            const [stats, setStats] = useState(loadStats());

            useEffect(() => {
                try {
                    localStorage.setItem('vocabStats', JSON.stringify(stats));
                } catch (e) {
                    console.warn("無法寫入本地紀錄");
                }
            }, [stats]);

            const availableLevels = window.VOCAB_DB ? Object.keys(window.VOCAB_DB).sort() : [];
            const [selectedLevels, setSelectedLevels] = useState(availableLevels.length > 0 ? [availableLevels[availableLevels.length-1]] : []);
            const [currentTab, setCurrentTab] = useState('study'); 
            
            const [studyIndex, setStudyIndex] = useState(0);
            const [hideKana, setHideKana] = useState(false);
            const [hideKanji, setHideKanji] = useState(false);
            const [hideMeaning, setHideMeaning] = useState(false);
            const [isRandomStudy, setIsRandomStudy] = useState(false);

            const [examConfig, setExamConfig] = useState({ hideKanji: false, hideKana: true, hideMeaning: false, mode: 'random' });
            const [examQuestions, setExamQuestions] = useState([]);
            const [examIndex, setExamIndex] = useState(0);
            const [examAnswers, setExamAnswers] = useState({});
            const [examSubmitted, setExamSubmitted] = useState(false);

            const currentVocabList = useMemo(() => {
                if (!window.VOCAB_DB) return [];
                let list = [];
                selectedLevels.forEach(level => {
                    if (window.VOCAB_DB[level]) list = list.concat(window.VOCAB_DB[level]);
                });
                return list;
            }, [selectedLevels]);

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            };

            const updateStats = (id, isCorrect) => {
                setStats(prev => {
                    const s = prev[id] || { correct: 0, wrong: 0 };
                    return {
                        ...prev,
                        [id]: { correct: s.correct + (isCorrect ? 1 : 0), wrong: s.wrong + (isCorrect ? 0 : 1) }
                    };
                });
            };

            const exportData = () => {
                let exportText = "// 請將此內容覆蓋對應的 vocab_NX.js\nwindow.VOCAB_DB = window.VOCAB_DB || {};\n";
                selectedLevels.forEach(level => {
                    let updatedList = window.VOCAB_DB[level].map(v => {
                        // 修正：使用舊式寫法避開 SyntaxError
                        const stat = stats[v.id] || { correct: 0, wrong: 0 };
                        return {
                            ...v,
                            correct: stat.correct || 0,
                            wrong: stat.wrong || 0
                        };
                    });
                    exportText += `window.VOCAB_DB.${level} = ${JSON.stringify(updatedList, null, 4)};\n\n`;
                });
                const blob = new Blob([exportText], { type: "text/javascript;charset=utf-8" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `vocab_exported.js`;
                link.click();
            };

            const startExam = () => {
                const hiddenCount = [examConfig.hideKanji, examConfig.hideKana, examConfig.hideMeaning].filter(Boolean).length;
                if (hiddenCount === 0 || hiddenCount > 2) {
                    alert("請選擇遮擋 1 到 2 個欄位！");
                    return;
                }

                let pool = [...currentVocabList];
                if (examConfig.mode === 'mistakes') {
                    pool = pool.filter(v => ((stats[v.id] && stats[v.id].wrong) || 0) > 0);
                    if (pool.length < 4) { alert("答錯題目太少，無法進行錯題模式！(至少需4題)"); return; }
                } else if (examConfig.mode === 'weighted') {
                    pool.sort((a, b) => {
                        const rateA = ((stats[a.id] && stats[a.id].wrong) || 0) / (((stats[a.id] && stats[a.id].correct) || 0) + ((stats[a.id] && stats[a.id].wrong) || 0) + 1);
                        const rateB = ((stats[b.id] && stats[b.id].wrong) || 0) / (((stats[b.id] && stats[b.id].correct) || 0) + ((stats[b.id] && stats[b.id].wrong) || 0) + 1);
                        return (Math.random() * (1 - rateA)) - (Math.random() * (1 - rateB));
                    });
                } else {
                    pool.sort(() => Math.random() - 0.5); 
                }

                const generateOptions = (correctWord, field) => {
                    const options = new Set([correctWord[field]]);
                    while(options.size < 4 && options.size < currentVocabList.length) {
                        const randomWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
                        options.add(randomWord[field]);
                    }
                    return Array.from(options).sort(() => Math.random() - 0.5);
                };

                const questions = pool.map(word => ({
                    word,
                    optionsKanji: examConfig.hideKanji ? generateOptions(word, 'kanji') : null,
                    optionsKana: examConfig.hideKana ? generateOptions(word, 'kana') : null,
                    optionsMeaning: examConfig.hideMeaning ? generateOptions(word, 'meaning') : null,
                }));

                setExamQuestions(questions);
                setExamIndex(0);
                setExamAnswers({});
                setExamSubmitted(false);
                setCurrentTab('exam');
            };

            const submitExamAnswer = () => {
                const q = examQuestions[examIndex];
                let isCorrect = true;
                if (examConfig.hideKanji && examAnswers.kanji !== q.word.kanji) isCorrect = false;
                if (examConfig.hideKana && examAnswers.kana !== q.word.kana) isCorrect = false;
                if (examConfig.hideMeaning && examAnswers.meaning !== q.word.meaning) isCorrect = false;
                
                updateStats(q.word.id, isCorrect);
                setExamSubmitted(true);
            };

            if (availableLevels.length === 0) {
                return (
                    <div className="flex flex-col justify-center items-center h-screen bg-slate-50 p-6 text-center">
                        <i className="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                        <h2 className="text-xl font-bold text-slate-800 mb-2">尚未讀取到單字庫</h2>
                        <p className="text-slate-500">請確認你有將 <b>vocab_N5.js</b> 與此頁面放在同一個資料夾，並一同推送到伺服器上。</p>
                    </div>
                );
            }

            return (
                <div className="max-w-xl mx-auto min-h-screen flex flex-col bg-slate-50">
                    <div className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="p-4 flex justify-between items-center">
                            <h1 className="text-xl font-bold text-slate-800">日文全方位自學</h1>
                            <button onClick={exportData} className="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded text-slate-700">
                                <i className="fas fa-download mr-1"></i>匯出紀錄
                            </button>
                        </div>
                        
                        <div className="px-4 pb-2 flex gap-2 overflow-x-auto">
                            {availableLevels.map(lvl => (
                                <label key={lvl} className="flex items-center gap-1 bg-blue-50 px-2 py-1 rounded cursor-pointer text-sm select-none hover:bg-blue-100">
                                    <input type="checkbox" className="accent-blue-600" 
                                        checked={selectedLevels.includes(lvl)}
                                        onChange={(e) => {
                                            if(e.target.checked) setSelectedLevels([...selectedLevels, lvl]);
                                            else if(selectedLevels.length > 1) setSelectedLevels(selectedLevels.filter(l => l !== lvl));
                                        }} 
                                    />
                                    {lvl}
                                </label>
                            ))}
                        </div>

                        <div className="flex border-t">
                            <button onClick={() => setCurrentTab('study')} className={`flex-1 py-3 text-sm tab-btn ${currentTab === 'study' ? 'active' : 'text-slate-500'}`}>學習模式</button>
                            <button onClick={() => setCurrentTab('exam_setup')} className={`flex-1 py-3 text-sm tab-btn ${currentTab.startsWith('exam') ? 'active' : 'text-slate-500'}`}>考試模式</button>
                        </div>
                    </div>

                    <div className="p-4 flex-1 flex flex-col">
                        {currentTab === 'study' && currentVocabList.length > 0 && (() => {
                            const word = currentVocabList[studyIndex];
                            if (!word) return null;
                            const s = stats[word.id] || {correct:0, wrong:0};
                            const errRate = (s.correct+s.wrong)===0 ? 0 : Math.round(s.wrong/(s.correct+s.wrong)*100);

                            return (
                                <div className="flex flex-col flex-1">
                                    <div className="flex justify-between text-xs text-slate-500 mb-2">
                                        <span>進度: {studyIndex+1}/{currentVocabList.length}</span>
                                        <span>錯題率: <b className="text-red-500">{errRate}%</b></span>
                                    </div>

                                    <div className="bg-white rounded-2xl shadow-sm p-6 text-center relative mb-4">
                                        <button onClick={() => speak(word.kana)} className="absolute top-4 right-4 text-slate-300 hover:text-blue-500"><i className="fas fa-volume-up text-xl"></i></button>
                                        
                                        <div className={`text-5xl font-bold py-3 ${hideKanji ? 'blur-md bg-slate-200 text-transparent select-none' : 'text-slate-800'}`} onClick={() => setHideKanji(false)}>{word.kanji}</div>
                                        
                                        <div className={`flex justify-center items-center gap-2 py-2 ${hideKana ? 'blur-md bg-slate-200 text-transparent select-none' : ''}`} onClick={() => setHideKana(false)}>
                                            <span className="text-2xl text-slate-600">{word.kana}</span>
                                            {word.accent !== undefined && <span className="text-xs bg-blue-50 text-blue-500 px-2 rounded-full">[{word.accent}]</span>}
                                        </div>
                                        
                                        <hr className="my-3 opacity-50" />
                                        <div className={`text-xl py-2 ${hideMeaning ? 'blur-md bg-slate-200 text-transparent select-none' : 'text-blue-600 font-bold'}`} onClick={() => setHideMeaning(false)}>{word.meaning}</div>

                                        {(word.example || word.notes) && (
                                            <div className="mt-4 text-left bg-slate-50 p-3 rounded-lg text-sm border border-slate-100">
                                                {word.example && <div className="mb-1"><span className="font-bold text-slate-500 mr-1">例:</span>{word.example}</div>}
                                                {word.notes && <div><span className="font-bold text-slate-500 mr-1">註:</span>{word.notes}</div>}
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        <button onClick={() => setHideKanji(!hideKanji)} className={`py-2 text-xs rounded-lg border font-bold ${hideKanji?'bg-slate-800 text-white':'bg-white text-slate-600'}`}>遮漢字</button>
                                        <button onClick={() => setHideKana(!hideKana)} className={`py-2 text-xs rounded-lg border font-bold ${hideKana?'bg-slate-800 text-white':'bg-white text-slate-600'}`}>遮假名</button>
                                        <button onClick={() => setHideMeaning(!hideMeaning)} className={`py-2 text-xs rounded-lg border font-bold ${hideMeaning?'bg-slate-800 text-white':'bg-white text-slate-600'}`}>遮中文</button>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <button onClick={() => {updateStats(word.id, false); setStudyIndex((studyIndex+1)%currentVocabList.length);}} className="py-3 bg-red-50 text-red-600 rounded-xl font-bold border border-red-100 shadow-sm"><i className="fas fa-times mr-2"></i>忘記了</button>
                                        <button onClick={() => {updateStats(word.id, true); setStudyIndex((studyIndex+1)%currentVocabList.length);}} className="py-3 bg-green-50 text-green-600 rounded-xl font-bold border border-green-100 shadow-sm"><i className="fas fa-check mr-2"></i>記住了</button>
                                    </div>
                                    
                                    <div className="mt-auto flex justify-between items-center px-4 py-2 bg-white rounded-full shadow-sm border">
                                        <button onClick={()=>setStudyIndex((studyIndex-1+currentVocabList.length)%currentVocabList.length)} className="p-2 text-slate-400"><i className="fas fa-chevron-left text-lg"></i></button>
                                        <button onClick={()=>setIsRandomStudy(!isRandomStudy)} className={`text-xs font-bold flex flex-col items-center ${isRandomStudy?'text-blue-500':'text-slate-400'}`}>
                                            <i className="fas fa-random mb-1 text-lg"></i>
                                            {isRandomStudy?'隨機':'循序'}
                                        </button>
                                        <button onClick={()=>setStudyIndex(isRandomStudy ? Math.floor(Math.random()*currentVocabList.length) : (studyIndex+1)%currentVocabList.length)} className="p-2 text-slate-400"><i className="fas fa-chevron-right text-lg"></i></button>
                                    </div>
                                </div>
                            );
                        })()}

                        {currentTab === 'exam_setup' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h2 className="text-lg font-bold mb-4 border-b pb-2"><i className="fas fa-sliders-h mr-2"></i>測驗設定</h2>
                                
                                <div className="mb-6">
                                    <p className="text-sm font-bold text-slate-500 mb-2">要遮擋哪些欄位？(最多選 2 個)</p>
                                    <div className="grid grid-cols-3 gap-2">
                                        <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideKanji?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                            <input type="checkbox" className="hidden" checked={examConfig.hideKanji} onChange={(e)=>setExamConfig({...examConfig, hideKanji: e.target.checked})} /> 漢字
                                        </label>
                                        <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideKana?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                            <input type="checkbox" className="hidden" checked={examConfig.hideKana} onChange={(e)=>setExamConfig({...examConfig, hideKana: e.target.checked})} /> 假名
                                        </label>
                                        <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideMeaning?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                            <input type="checkbox" className="hidden" checked={examConfig.hideMeaning} onChange={(e)=>setExamConfig({...examConfig, hideMeaning: e.target.checked})} /> 中文
                                        </label>
                                    </div>
                                </div>

                                <div className="mb-8">
                                    <p className="text-sm font-bold text-slate-500 mb-2">抽考邏輯</p>
                                    <select className="w-full p-3 border rounded-xl bg-slate-50 text-slate-700 font-bold outline-none focus:border-blue-500" value={examConfig.mode} onChange={(e)=>setExamConfig({...examConfig, mode: e.target.value})}>
                                        <option value="random">完全隨機抽考</option>
                                        <option value="weighted">弱點加權 (錯越多越容易出)</option>
                                        <option value="mistakes">地獄錯題本 (只考曾經錯過的)</option>
                                    </select>
                                </div>

                                <button onClick={startExam} className="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-700 transition-colors">
                                    <i className="fas fa-play mr-2"></i>開始測驗
                                </button>
                            </div>
                        )}

                        {currentTab === 'exam' && examQuestions.length > 0 && (() => {
                            const q = examQuestions[examIndex];
                            
                            const renderOptions = (title, field, options) => {
                                if (!options) return null;
                                return (
                                    <div className="mb-4">
                                        <div className="text-xs font-bold text-slate-400 mb-2">選擇正確的{title}</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            {options.map((opt, i) => {
                                                const isSelected = examAnswers[field] === opt;
                                                const isCorrectAns = q.word[field] === opt;
                                                let btnClass = "py-3 px-2 text-sm rounded-lg border font-bold transition-colors ";
                                                
                                                if (!examSubmitted) {
                                                    btnClass += isSelected ? "bg-blue-100 border-blue-500 text-blue-700 shadow-sm" : "bg-white text-slate-600 hover:bg-slate-50";
                                                } else {
                                                    if (isCorrectAns) btnClass += "bg-green-100 border-green-500 text-green-700";
                                                    else if (isSelected && !isCorrectAns) btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                    else btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                }
                                                return (
                                                    <button key={i} disabled={examSubmitted} onClick={() => setExamAnswers({...examAnswers, [field]: opt})} className={btnClass}>
                                                        {opt}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            };

                            const allAnswered = (!examConfig.hideKanji || examAnswers.kanji) && 
                                                (!examConfig.hideKana || examAnswers.kana) && 
                                                (!examConfig.hideMeaning || examAnswers.meaning);

                            return (
                                <div className="flex flex-col flex-1">
                                    <div className="text-center text-sm font-bold text-slate-500 mb-4">
                                        測驗進度：{examIndex + 1} / {examQuestions.length}
                                    </div>

                                    <div className="bg-white rounded-2xl shadow-sm p-6 mb-4 border border-slate-100">
                                        <div className="text-center mb-6">
                                            <div className="text-xs font-bold text-blue-400 mb-2">請看題</div>
                                            {!examConfig.hideKanji && <div className="text-4xl font-bold mb-2">{q.word.kanji}</div>}
                                            {!examConfig.hideKana && <div className="text-2xl text-slate-600 mb-2">{q.word.kana}</div>}
                                            {!examConfig.hideMeaning && <div className="text-xl text-blue-600 font-bold">{q.word.meaning}</div>}
                                        </div>

                                        <hr className="my-4 border-slate-100" />
                                        
                                        {renderOptions("漢字", "kanji", q.optionsKanji)}
                                        {renderOptions("假名", "kana", q.optionsKana)}
                                        {renderOptions("中文", "meaning", q.optionsMeaning)}
                                    </div>

                                    {!examSubmitted ? (
                                        <button 
                                            onClick={submitExamAnswer} 
                                            disabled={!allAnswered}
                                            className={`py-4 rounded-xl font-bold w-full mt-auto transition-all ${allAnswered ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                        >
                                            確認答案
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => {
                                                if (examIndex + 1 < examQuestions.length) {
                                                    setExamIndex(examIndex + 1);
                                                    setExamAnswers({});
                                                    setExamSubmitted(false);
                                                } else {
                                                    alert("測驗完成！成績已記錄。");
                                                    setCurrentTab('exam_setup');
                                                }
                                            }} 
                                            className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg"
                                        >
                                            {examIndex + 1 < examQuestions.length ? "下一題" : "完成測驗"}
                                        </button>
                                    )}
                                </div>
                            );
                        })()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
