                                        <div className="grid grid-cols-3 gap-2">
                                            <label className={`block text-center py-2 border rounded-xl font-bold transition-colors ${!examConfig.hideKanji ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : examConfig.testKanji ? 'bg-blue-600 text-white border-blue-600 shadow-md cursor-pointer' : 'bg-slate-50 text-slate-500 cursor-pointer hover:bg-slate-100'}`}>
                                                <input type="checkbox" className="hidden" disabled={!examConfig.hideKanji} checked={examConfig.testKanji} onChange={(e)=>setExamConfig({...examConfig, testKanji: e.target.checked})} /> 考漢字
                                            </label>
                                            <label className={`block text-center py-2 border rounded-xl font-bold transition-colors ${!examConfig.hideKana ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : examConfig.testKana ? 'bg-blue-600 text-white border-blue-600 shadow-md cursor-pointer' : 'bg-slate-50 text-slate-500 cursor-pointer hover:bg-slate-100'}`}>
                                                <input type="checkbox" className="hidden" disabled={!examConfig.hideKana} checked={examConfig.testKana} onChange={(e)=>setExamConfig({...examConfig, testKana: e.target.checked})} /> 考假名
                                            </label>
                                            <label className={`block text-center py-2 border rounded-xl font-bold transition-colors ${!examConfig.hideMeaning ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : examConfig.testMeaning ? 'bg-blue-600 text-white border-blue-600 shadow-md cursor-pointer' : 'bg-slate-50 text-slate-500 cursor-pointer hover:bg-slate-100'}`}>
                                                <input type="checkbox" className="hidden" disabled={!examConfig.hideMeaning} checked={examConfig.testMeaning} onChange={(e)=>setExamConfig({...examConfig, testMeaning: e.target.checked})} /> 考中文
                                            </label>
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <p className="text-sm font-bold text-slate-500 mb-2">出題邏輯</p>
                                        <select className="w-full p-3 border rounded-xl bg-slate-50 text-slate-700 font-bold outline-none focus:border-blue-500" value={examConfig.mode} onChange={(e)=>setExamConfig({...examConfig, mode: e.target.value})}>
                                            <option value="random">完全隨機抽考</option>
                                            <option value="weighted">弱點加權 (錯越多越容易出)</option>
                                            <option value="mistakes">地獄錯題本 (只考曾經錯過的)</option>
                                            <option value="favorites">我的最愛 (隨機)</option>
                                            <option value="viewed">已學習單字 (隨機)</option>
                                        </select>
                                    </div>

                                    <button onClick={startExam} className="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-700 transition-colors">
                                        <i className="fas fa-play mr-2"></i>開始測驗
                                    </button>
                                </div>
                            )}

                            {currentTab === 'exam' && showSummary && (() => {
                                const sortedWords = [...testedWords].sort((a, b) => {
                                    const wrongA = (stats[a.word.id] && stats[a.word.id].wrong) || 0;
                                    const wrongB = (stats[b.word.id] && stats[b.word.id].wrong) || 0;
                                    return wrongB - wrongA; // 錯誤次數由大到小
                                });

                                return (
                                    <div className="flex flex-col flex-1 h-full">
                                        <h2 className="text-2xl font-bold text-slate-800 mb-4 text-center"><i className="fas fa-clipboard-check mr-2 text-blue-500"></i>本次考試總結</h2>

                                        <div className="bg-white rounded-2xl shadow-sm p-4 flex-1 overflow-y-auto mb-4 border border-slate-100 max-h-[60vh]">
                                            {sortedWords.length === 0 ? (
                                                <div className="text-center text-slate-400 py-10 font-bold mt-10">本次沒有作答紀錄</div>
                                            ) : (
                                                <div className="flex flex-col gap-4">
                                                    {sortedWords.map((item, idx) => {
                                                        const s = stats[item.word.id] || { correct: 0, wrong: 0, history: [] };
                                                        const history = s.history || [];
                                                        const recent10 = history.slice(-10);
                                                        const recentWrong = recent10.filter(res => !res).length;

                                                        return (
                                                            <div key={idx} className="flex flex-col p-4 bg-slate-50 rounded-xl border border-slate-200 relative">
                                                                <div className="absolute top-4 right-4 text-2xl">
                                                                    {item.isCorrect ? <i className="fas fa-check-circle text-green-500"></i> : <i className="fas fa-times-circle text-red-500"></i>}
                                                                </div>
                                                                <div className="text-xl font-bold text-slate-800 mb-1">{item.word.kanji}</div>
                                                                <div className="text-xs text-slate-500 mb-3">{item.word.kana} | {item.word.meaning}</div>

                                                                <div className="grid grid-cols-2 gap-2 text-xs font-bold text-slate-600 mb-3">
                                                                    <div className="bg-white py-2 px-3 rounded-lg border border-slate-200 text-center shadow-sm">
                                                                        有史以來錯誤 <br/><span className="text-red-500 text-lg">{s.wrong}</span> 次
                                                                    </div>
                                                                    <div className="bg-white py-2 px-3 rounded-lg border border-slate-200 text-center shadow-sm">
                                                                        近 10 次錯誤 <br/><span className="text-red-500 text-lg">{recentWrong}</span> 次
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center mt-1 bg-white p-2 rounded-lg border border-slate-100">
                                                                    <span className="text-[10px] text-slate-400 mr-2 font-bold w-14">近10次軌跡</span>
                                                                    <div className="flex gap-1">
                                                                        {recent10.map((res, i) => (
                                                                            <div key={i} className={`w-3 h-3 rounded-full ${res ? 'bg-green-400' : 'bg-red-400'} shadow-sm`}></div>
                                                                        ))}
                                                                        {Array.from({length: 10 - recent10.length}).map((_, i) => (
                                                                            <div key={'empty'+i} className="w-3 h-3 rounded-full bg-slate-200"></div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )}
                                        </div>

                                        <button onClick={() => { setShowSummary(false); setCurrentTab('exam_setup'); }} className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg hover:bg-slate-700 active:scale-95 transition-all">
                                            返回設定
                                        </button>
                                    </div>
                                );
                            })()}

                            {currentTab === 'exam' && examQuestions.length > 0 && !showSummary && (() => {
                                const q = examQuestions[examIndex];

                                const renderOptions = (title, field, options) => {
                                    if (!options) return null;

                                    let bottomField = '';
                                    if (examConfig.testMeaning) bottomField = 'meaning';
                                    else if (examConfig.testKana) bottomField = 'kana';
                                    else if (examConfig.testKanji) bottomField = 'kanji';

                                    return (
                                        <div className="mb-4">
                                            <div className="text-xs font-bold text-slate-400 mb-2">選擇正確的{title}</div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {options.map((optWord, i) => {
                                                    const optValue = optWord[field];
                                                    const isSelected = examAnswers[field] === optValue;
                                                    const isCorrectAns = q.word[field] === optValue;
                                                    let btnClass = "py-3 px-2 text-sm rounded-lg border font-bold transition-all flex flex-col items-center justify-center gap-1 relative ";

                                                    if (!examSubmitted) {
                                                        btnClass += isSelected ? "bg-blue-100 border-blue-500 text-blue-700 shadow-sm cursor-pointer" : "bg-white text-slate-600 hover:bg-slate-50 cursor-pointer";
                                                    } else {
                                                        if (isCorrectAns) btnClass += "bg-green-100 border-green-500 text-green-700";
                                                        else if (isSelected && !isCorrectAns) btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                        else btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                    }

                                                    const isBottomField = (field === bottomField);

                                                    return (
                                                        <div key={i} onClick={() => !examSubmitted && setExamAnswers({...examAnswers, [field]: optValue})} className={btnClass}>
                                                            <span className="flex items-center justify-center gap-1">
                                                                {optValue}
                                                                {/* 👉 修正：若該選項就是平假名，在後方直接補上重音標示 */}
                                                                {field === 'kana' && optWord.accent !== undefined && (
                                                                    <span className="bg-black/10 px-1 rounded-sm text-black/60 text-[11px] leading-none">[{optWord.accent}]</span>
                                                                )}
                                                            </span>

                                                            {examSubmitted && isBottomField && (
                                                                <div className={`text-[11px] font-normal opacity-90 flex flex-col items-center gap-1 mt-1 ${isCorrectAns ? 'text-green-800' : 'text-slate-500'}`}>
                                                                    {field === 'kanji' && (
                                                                        <React.Fragment>
                                                                            <span className="flex items-center gap-1">{optWord.kana} {optWord.accent !== undefined && <span className="bg-black/10 px-1 rounded-sm text-black/60">[{optWord.accent}]</span>}</span>
                                                                            <span>{optWord.meaning}</span>
                                                                        </React.Fragment>
                                                                    )}
                                                                    {field === 'kana' && (
                                                                        <React.Fragment>
                                                                            <span>{optWord.kanji}</span>
                                                                            <span>{optWord.meaning}</span>
                                                                        </React.Fragment>
                                                                    )}
                                                                    {field === 'meaning' && (
                                                                        <React.Fragment>
                                                                            <span>{optWord.kanji}</span>
                                                                            <span className="flex items-center gap-1">{optWord.kana} {optWord.accent !== undefined && <span className="bg-black/10 px-1 rounded-sm text-black/60">[{optWord.accent}]</span>}</span>
                                                                        </React.Fragment>
                                                                    )}
                                                                </div>
                                                            )}

                                                            {examSubmitted && isBottomField && (
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); speak(optWord, false); }}
                                                                    className="absolute top-2 right-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                >
                                                                    <i className="fas fa-volume-up text-sm"></i>
                                                                </button>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                };

                                const allAnswered = (!examConfig.testKanji || examAnswers.kanji) && (!examConfig.testKana || examAnswers.kana) && (!examConfig.testMeaning || examAnswers.meaning);

                                return (
                                    <div className="flex flex-col flex-1">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="text-sm font-bold text-slate-500">
                                                進度：{examIndex + 1} / {examQuestions.length}
                                            </div>
                                            <button onClick={finishExam} className="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-full font-bold hover:bg-red-100 border border-red-200 active:scale-95 transition-all">
                                                <i className="fas fa-stop-circle mr-1"></i>提前結束
                                            </button>
                                        </div>

                                        {examConfig.type === 'listening' && (
                                            <div className="mb-4 bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                                                <div className="flex justify-between text-xs font-bold text-slate-400 mb-2">
                                                    <span className="flex items-center"><i className="fas fa-stopwatch mr-1"></i>剩餘時間</span>
                                                    <span className={timeLeft <= 3 ? 'text-red-500 animate-pulse' : 'text-blue-500'}>{timeLeft} 秒</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                    <div className={`h-full transition-all duration-1000 linear ${timeLeft <= 3 ? 'bg-red-500' : 'bg-blue-500'}`} style={{ width: `${(timeLeft / 10) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        )}

                                        <div className="bg-white rounded-2xl shadow-sm p-6 mb-4 border border-slate-100 flex-1 flex flex-col relative">
                                            {examConfig.type === 'standard' ? (
                                                <React.Fragment>
                                                    <div className="text-center mb-6 relative">
                                                        {/* 👉 新增：考試中將單字加入我的最愛 (放右上角) */}
                                                        <div className="absolute top-0 right-0 z-10">
                                                            <button onClick={() => toggleFavorite(q.word.id)} className="text-2xl hover:scale-110 active:scale-95 transition-transform">
                                                                {favoriteIds.has(q.word.id) ? <i className="fas fa-heart text-red-500 drop-shadow-sm"></i> : <i className="far fa-heart text-slate-300 hover:text-red-400"></i>}
                                                            </button>
                                                        </div>

                                                        <div className="text-xs font-bold text-blue-400 mb-2 mt-2">請看題</div>
                                                        {(!examConfig.hideKanji || examSubmitted) && <div className="text-4xl font-bold mb-2">{q.word.kanji}</div>}
                                                        {(!examConfig.hideKana || examSubmitted) && <div className="text-2xl text-slate-600 mb-2">{q.word.kana}</div>}
                                                        {(!examConfig.hideMeaning || examSubmitted) && <div className="text-xl text-blue-600 font-bold">{q.word.meaning}</div>}
                                                    </div>
                                                    <hr className="my-4 border-slate-100" />
                                                    {renderOptions("漢字", "kanji", q.optionsKanji)}
                                                    {renderOptions("假名", "kana", q.optionsKana)}
                                                    {renderOptions("中文", "meaning", q.optionsMeaning)}

                                                    {examSubmitted && q.word.example && (
                                                        <div className="mt-2 text-left bg-blue-50/50 p-3 rounded-lg text-sm border border-blue-100">
                                                            <div className="flex items-center mb-1">
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); speak(q.word, true); }}
                                                                    className="mr-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                >
                                                                    <i className="fas fa-volume-up text-sm"></i>
                                                                </button>
                                                                <span className="font-bold text-blue-500 mr-2">例句</span>
                                                                <span className="text-slate-700">{q.word.example.split(' (')[0]}</span>
                                                            </div>
                                                            {q.word.example.includes('(') && (
                                                                <div className="text-slate-500 text-xs ml-9">
                                                                    ({q.word.example.split('(')[1]}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            ) : (
                                                <React.Fragment>
                                                    <div className="text-center py-6 mb-6 relative flex flex-col items-center">
                                                        {/* 👉 新增：考試中將單字加入我的最愛 (放左上角) */}
                                                        <div className="absolute top-0 left-0 z-10">
                                                            <button onClick={() => toggleFavorite(q.word.id)} className="text-2xl hover:scale-110 active:scale-95 transition-transform">
                                                                {favoriteIds.has(q.word.id) ? <i className="fas fa-heart text-red-500 drop-shadow-sm"></i> : <i className="far fa-heart text-slate-300 hover:text-red-400"></i>}
                                                            </button>
                                                        </div>

                                                        {/* 👉 移動：聽力測驗暫停自動跳轉的按鈕 (移至右上角) */}
                                                        {examSubmitted && (
                                                            <div className="absolute top-0 right-0 z-10 flex gap-2">
                                                                {!isAutoPaused ? (
                                                                    <button
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);
                                                                            setIsAutoPaused(true);
                                                                        }}
                                                                        className="px-3 py-1.5 bg-amber-50 text-amber-600 rounded-full font-bold border border-amber-200 hover:bg-amber-100 active:scale-95 transition-all shadow-sm text-xs flex items-center"
                                                                    >
                                                                        <i className="fas fa-pause mr-1"></i> 暫停跳題
                                                                    </button>
                                                                ) : (
                                                                    <button
                                                                        onClick={() => {
                                                                            setExamAnswers({});
                                                                            setExamSubmitted(false);
                                                                            setIsAutoPaused(false);
                                                                            if (examIndex + 1 < examQuestions.length) {
                                                                                setExamIndex(prev => prev + 1);
                                                                                setTimeLeft(10);
                                                                            } else {
                                                                                finishExam();
                                                                            }
                                                                        }}
                                                                        className="px-3 py-1.5 bg-blue-600 text-white rounded-full font-bold shadow-sm hover:bg-blue-700 active:scale-95 transition-all text-xs flex items-center"
                                                                    >
                                                                        {examIndex + 1 < examQuestions.length ? "下一題" : "看總結"} <i className="fas fa-chevron-right ml-1"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        )}

                                                        <i className="fas fa-headphones-alt text-6xl text-blue-500 mb-6 mt-4 animate-pulse drop-shadow-md"></i>
                                                        <div className="text-sm font-bold text-slate-500 bg-slate-50 inline-block px-4 py-2 rounded-full border border-slate-100">
                                                            請仔細聽發音，並選出正確的中文意思
                                                        </div>
                                                    </div>
                                                    <hr className="my-4 border-slate-100" />
                                                    <div className="grid grid-cols-2 gap-3 mt-auto">
                                                        {q.optionsMeaning.map((optWord, i) => {
                                                            const optValue = optWord.meaning;
                                                            let btnClass = "py-5 px-2 text-lg rounded-xl border-2 font-bold transition-all shadow-sm flex flex-col items-center justify-center gap-2 relative ";

                                                            if (!examSubmitted) {
                                                                btnClass += "bg-white text-slate-700 hover:bg-blue-50 border-slate-100 hover:border-blue-300 active:scale-95 cursor-pointer";
                                                            } else {
                                                                const isSelected = examAnswers.listening === optValue;
                                                                const isCorrectAns = q.word.meaning === optValue;

                                                                if (isCorrectAns) {
                                                                    btnClass += "bg-green-100 border-green-500 text-green-700";
                                                                } else if (isSelected && !isCorrectAns) {
                                                                    btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                                } else {
                                                                    btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                                }
                                                            }

                                                            return (
                                                                <div key={i} onClick={() => !examSubmitted && handleListeningAnswer(optValue)} className={btnClass}>
                                                                    <span className="text-center">{optValue}</span>

                                                                    {examSubmitted && (
                                                                        <div className="text-sm font-normal opacity-90 flex flex-col items-center gap-1 text-slate-600 mt-1">
                                                                            <span>{optWord.kanji}</span>
                                                                            <span className="flex items-center gap-1">{optWord.kana} {optWord.accent !== undefined && <span className="bg-black/10 px-1.5 rounded-sm text-black/60">[{optWord.accent}]</span>}</span>
                                                                        </div>
                                                                    )}

                                                                    {examSubmitted && (
                                                                        <button
                                                                            onClick={(e) => { e.stopPropagation(); speak(optWord, false); }}
                                                                            className="absolute top-2 right-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                        >
                                                                            <i className="fas fa-volume-up text-sm"></i>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>

                                                    {examSubmitted && q.word.example && (
                                                        <div className="mt-4 text-left bg-blue-50/50 p-3 rounded-lg text-sm border border-blue-100">
                                                            <div className="flex items-center mb-1">
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); speak(q.word, true); }}
                                                                    className="mr-2 text-slate-400 hover:text-blue-500 transition-colors"
                                                                >
                                                                    <i className="fas fa-volume-up text-sm"></i>
                                                                </button>
                                                                <span className="font-bold text-blue-500 mr-2">例句</span>
                                                                <span className="text-slate-700">{q.word.example.split(' (')[0]}</span>
                                                            </div>
                                                            {q.word.example.includes('(') && (
                                                                <div className="text-slate-500 text-xs ml-9">
                                                                    ({q.word.example.split('(')[1]}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            )}
                                        </div>

                                        {examConfig.type === 'standard' && (
                                            !examSubmitted ? (
                                                <button onClick={submitStandardAnswer} disabled={!allAnswered} className={`py-4 rounded-xl font-bold w-full mt-auto transition-all ${allAnswered ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                    確認答案
                                                </button>
                                            ) : (
                                                <button onClick={() => {
                                                    if (examIndex + 1 < examQuestions.length) {
                                                        setExamIndex(examIndex + 1); setExamAnswers({}); setExamSubmitted(false);
                                                    } else {
                                                        finishExam();
                                                    }
                                                }} className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg hover:bg-slate-700">
                                                    {examIndex + 1 < examQuestions.length ? "下一題" : "查看總結"}
                                                </button>
                                            )
                                        )}
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
