<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文全方位自學系統</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 自動讀取同資料夾下的單字庫 -->
    <script src="vocab_N1.js" onerror="console.log('尚未建立 N1')"></script>
    <script src="vocab_N2.js" onerror="console.log('尚未建立 N2')"></script>
    <script src="vocab_N3.js" onerror="console.log('尚未建立 N3')"></script>
    <script src="vocab_N4.js" onerror="console.log('尚未建立 N4')"></script>
    <script src="vocab_N5.js" onerror="console.log('尚未建立 N5')"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Noto Sans JP', 'Microsoft JhengHei', sans-serif; }
        .tab-btn.active { border-bottom: 4px solid #3b82f6; color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        let globalAudioCtx = null;
        const getAudioCtx = () => {
            // 👉 修正：偵測 'closed' 狀態，當背景閒置太久被 OS 砍掉時，重新建立音效引擎
            if (!globalAudioCtx || globalAudioCtx.state === 'closed') {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                globalAudioCtx = new AudioContext();
            }
            // 👉 修正：相容 iOS Safari 的 'interrupted' 狀態
            if (globalAudioCtx.state === 'suspended' || globalAudioCtx.state === 'interrupted') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        };

        function App() {
            // 成績讀寫防護機制
            const loadStats = () => {
                try {
                    return JSON.parse(localStorage.getItem('vocabStats')) || {};
                } catch (e) {
                    console.warn("無法讀取本地紀錄");
                    return {};
                }
            };

            const [stats, setStats] = useState(loadStats());

            useEffect(() => {
                try {
                    localStorage.setItem('vocabStats', JSON.stringify(stats));
                } catch (e) {
                    console.warn("無法寫入本地紀錄");
                }
            }, [stats]);

            const availableLevels = window.VOCAB_DB ? Object.keys(window.VOCAB_DB).sort() : [];

            // 👉 新增：記憶上次勾選的級別與分頁
            const [selectedLevels, setSelectedLevels] = useState(() => {
                try {
                    const saved = JSON.parse(localStorage.getItem('vocabLevels'));
                    if (saved && saved.length > 0) return saved;
                } catch(e) {}
                return availableLevels.length > 0 ? [availableLevels[availableLevels.length-1]] : [];
            });
            const [currentTab, setCurrentTab] = useState(() => localStorage.getItem('currentTab') || 'study');

            useEffect(() => localStorage.setItem('vocabLevels', JSON.stringify(selectedLevels)), [selectedLevels]);
            useEffect(() => localStorage.setItem('currentTab', currentTab), [currentTab]);

            // --- 類別篩選器狀態 (加入記憶功能) ---
            const [selectedCategories, setSelectedCategories] = useState(() => {
                try { return JSON.parse(localStorage.getItem('vocabCategories')) || []; } catch(e) { return []; }
            });
            useEffect(() => localStorage.setItem('vocabCategories', JSON.stringify(selectedCategories)), [selectedCategories]);

            const [showFilterModal, setShowFilterModal] = useState(false);

            const availableCategories = useMemo(() => {
                if (!window.VOCAB_DB) return [];
                const catSet = new Set();
                selectedLevels.forEach(level => {
                    if (window.VOCAB_DB[level]) {
                        window.VOCAB_DB[level].forEach(word => {
                            if (word.categories) {
                                word.categories.forEach(c => catSet.add(c));
                            }
                        });
                    }
                });
                return Array.from(catSet).sort();
            }, [selectedLevels]);

            const [studyIndex, setStudyIndex] = useState(0);
            // (原本用來記錄 viewedIds 的 useEffect 已被移至下方，以確保讀取到正確的錯題本清單)

            const loadViewedIds = () => {
                try {
                    const stored = JSON.parse(localStorage.getItem('viewedVocabIds'));
                    return stored ? new Set(stored) : new Set();
                } catch (e) {
                    return new Set();
                }
            };

            const [viewedIds, setViewedIds] = useState(loadViewedIds());

            useEffect(() => {
                try {
                    localStorage.setItem('viewedVocabIds', JSON.stringify(Array.from(viewedIds)));
                } catch (e) {
                    console.warn("無法寫入瀏覽紀錄");
                }
            }, [viewedIds]);

            const [hideKana, setHideKana] = useState(false);
            const [hideKanji, setHideKanji] = useState(false);
            const [hideMeaning, setHideMeaning] = useState(false);
            const [isRandomStudy, setIsRandomStudy] = useState(false);

            // --- 考試模式新狀態 ---
            const [examConfig, setExamConfig] = useState({ type: 'standard', hideKanji: false, hideKana: true, hideMeaning: false, mode: 'random' });
            const [examQuestions, setExamQuestions] = useState([]);
            const [examIndex, setExamIndex] = useState(0);
            const [examAnswers, setExamAnswers] = useState({});
            const [examSubmitted, setExamSubmitted] = useState(false);
            const [testedWords, setTestedWords] = useState([]); // 追蹤本次考試作答紀錄
            const [showSummary, setShowSummary] = useState(false); // 控制是否顯示成績總結
            const [timeLeft, setTimeLeft] = useState(10); // 聽力測驗 10 秒計時器
            const examTimeoutRef = React.useRef(null); // 👉 新增：控制 2 秒延遲的引用

            const currentVocabList = useMemo(() => {
                if (!window.VOCAB_DB) return [];
                let list = [];
                selectedLevels.forEach(level => {
                    if (window.VOCAB_DB[level]) list = list.concat(window.VOCAB_DB[level]);
                });

                if (selectedCategories.length > 0) {
                    list = list.filter(word =>
                        word.categories && word.categories.some(cat => selectedCategories.includes(cat))
                    );
                }
                return list;
            }, [selectedLevels, selectedCategories]);

            // 👉 新增：錯題本模式狀態與專屬清單
            const [isReviewMistakesMode, setIsReviewMistakesMode] = useState(false);

            const studyVocabList = useMemo(() => {
                if (!isReviewMistakesMode) return currentVocabList;

                return [...currentVocabList].filter(word => {
                    const s = stats[word.id];
                    if (!s || !s.history) return false;
                    return s.history.filter(res => !res).length > 0; // 近 10 次內有錯過才顯示
                }).sort((a, b) => {
                    const countA = stats[a.id].history ? stats[a.id].history.filter(res => !res).length : 0;
                    const countB = stats[b.id].history ? stats[b.id].history.filter(res => !res).length : 0;
                    if (countB !== countA) return countB - countA; // 首要條件：近 10 次錯越多次排越前面

                    // 次要條件：若近 10 次錯一樣多，則比較有史以來總錯誤次數
                    const totalA = stats[a.id].wrong || 0;
                    const totalB = stats[b.id].wrong || 0;
                    return totalB - totalA;
                });
            }, [currentVocabList, isReviewMistakesMode, stats]);

            useEffect(() => {
                setStudyIndex(0);
            }, [studyVocabList]);

            // 👉 新增：正確記錄「學習模式」當下看過的單字
            useEffect(() => {
                if (currentTab === 'study' && studyVocabList.length > 0 && studyVocabList[studyIndex]) {
                    setViewedIds(prev => {
                        const next = new Set(prev);
                        next.add(studyVocabList[studyIndex].id);
                        return next;
                    });
                }
            }, [studyIndex, studyVocabList, currentTab]);

            const [listeningIndex, setListeningIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isStopped, setIsStopped] = useState(true);
            const [isListeningRandom, setIsListeningRandom] = useState(false);
            const [isListeningLoop, setIsListeningLoop] = useState(false);
            const [listeningPlaylist, setListeningPlaylist] = useState([]);

            const isListeningLoopRef = React.useRef(isListeningLoop);
            isListeningLoopRef.current = isListeningLoop;
            const isListeningRandomRef = React.useRef(isListeningRandom);
            isListeningRandomRef.current = isListeningRandom;

            const generatePlaylist = (length, isRandom, startIndex = 0) => {
                let list = Array.from({length}, (_, i) => i);
                if (isRandom) {
                    for (let i = list.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [list[i], list[j]] = [list[j], list[i]];
                    }
                } else {
                    if (startIndex > 0 && startIndex < length) {
                        list = [...list.slice(startIndex), ...list.slice(0, startIndex)];
                    }
                }
                return list;
            };

            useEffect(() => {
                const len = currentVocabList.length;
                if (len > 0) {
                    // 產生一組輕量級的 ID，用來驗證目前的單字庫是否跟上次聽的一模一樣
                    const vocabKey = `${len}_${currentVocabList[0].id}_${currentVocabList[len-1].id}`;
                    try {
                        const saved = JSON.parse(localStorage.getItem('listeningProgress'));
                        // 如果單字庫沒變，就完整還原上次的隨機陣列與進度
                        if (saved && saved.vocabKey === vocabKey) {
                            setListeningPlaylist(saved.playlist);
                            setListeningIndex(saved.index < len ? saved.index : 0);
                            setIsListeningRandom(!!saved.random);
                            setIsListeningLoop(!!saved.loop);
                            setIsStopped(true);
                            setIsPlaying(false);
                            return;
                        }
                    } catch (e) {}

                    setListeningPlaylist(generatePlaylist(len, isListeningRandomRef.current, 0));
                    setListeningIndex(0);
                    setIsStopped(true);
                    setIsPlaying(false);
                } else {
                    setListeningPlaylist([]);
                }
            }, [currentVocabList]);

            // 👉 新增：自動儲存聽力模式的任何進度改變
            useEffect(() => {
                if (currentVocabList.length > 0 && listeningPlaylist.length > 0) {
                    const vocabKey = `${currentVocabList.length}_${currentVocabList[0].id}_${currentVocabList[currentVocabList.length-1].id}`;
                    localStorage.setItem('listeningProgress', JSON.stringify({
                        vocabKey,
                        playlist: listeningPlaylist,
                        index: listeningIndex,
                        random: isListeningRandom,
                        loop: isListeningLoop
                    }));
                }
            }, [listeningIndex, listeningPlaylist, isListeningRandom, isListeningLoop, currentVocabList]);

            const currentAudioSourceRef = React.useRef(null);
            const sequenceIdRef = React.useRef(0);

            useEffect(() => {
                if (currentTab !== 'listening' || !isPlaying || currentVocabList.length === 0 || listeningPlaylist.length === 0) {
                    stopCurrentAudio();
                    sequenceIdRef.current++;
                    return;
                }

                let isCancelled = false;
                const seqId = ++sequenceIdRef.current;
                const word = currentVocabList[listeningPlaylist[listeningIndex]];

                const runSequence = async () => {
                    const items = [
                        { url: `./audio/${word.id}_ja.mp3`, delay: 500 },
                        { url: `./audio/${word.id}_ja.mp3`, delay: 800 },
                        { url: `./audio/${word.id}_zh.mp3`, delay: 1000 }
                    ];

                    if (word.example) {
                        items.push({ url: `./audio/${word.id}_ex_ja.mp3`, delay: 1200 });
                        if (word.example.includes('(')) {
                            items.push({ url: `./audio/${word.id}_ex_zh.mp3`, delay: 800 });
                        }
                    }

                    for (let item of items) {
                        if (isCancelled || sequenceIdRef.current !== seqId) return;
                        if (item.delay) await new Promise(r => setTimeout(r, item.delay));
                        if (isCancelled || sequenceIdRef.current !== seqId) return;

                        const playLocalFile = async (url) => {
                            try {
                                if (isCancelled || sequenceIdRef.current !== seqId) return;
                                const ctx = getAudioCtx();

                                let response = null;
                                let fetchSuccess = false;
                                for (let attempt = 1; attempt <= 3; attempt++) {
                                    try {
                                        response = await fetch(url);
                                        if (response.ok) { fetchSuccess = true; break; }
                                    } catch (e) {
                                        if (attempt === 3) break;
                                        await new Promise(r => setTimeout(r, 200));
                                    }
                                }

                                if (!fetchSuccess) {
                                    if (window.location.protocol === 'file:') {
                                        alert("⚠️ Safari 安全限制警告\n\niOS Safari 嚴格禁止在單機模式 (file://) 下讀取音檔。\n請上傳至 GitHub Pages 上測試。");
                                        setIsPlaying(false);
                                        setIsStopped(true);
                                    }
                                    return;
                                }

                                const arrayBuffer = await response.arrayBuffer();
                                const audioBuffer = await new Promise((res, rej) => ctx.decodeAudioData(arrayBuffer, res, rej));
                                if (isCancelled || sequenceIdRef.current !== seqId) return;

                                await new Promise((resolve) => {
                                    const source = ctx.createBufferSource();
                                    source.buffer = audioBuffer;
                                    source.connect(ctx.destination);
                                    currentAudioSourceRef.current = source;
                                    source.onended = () => { currentAudioSourceRef.current = null; resolve(); };
                                    source.start(0);
                                });
                            } catch (error) {}
                        };
                        await playLocalFile(item.url);
                    }

                    if (isCancelled || sequenceIdRef.current !== seqId) return;
                    await new Promise(r => setTimeout(r, 1500));
                    if (isCancelled || sequenceIdRef.current !== seqId) return;

                    const len = currentVocabList.length;
                    if (listeningIndex + 1 >= len) {
                        if (!isListeningLoopRef.current) {
                            setIsPlaying(false); setIsStopped(true);
                        } else {
                            if (isListeningRandomRef.current) setListeningPlaylist(generatePlaylist(len, true));
                            setListeningIndex(0);
                        }
                    } else {
                        setListeningIndex(listeningIndex + 1);
                    }
                };

                runSequence();
                return () => { isCancelled = true; stopCurrentAudio(); };
            }, [listeningIndex, isPlaying, currentTab, currentVocabList, isListeningRandom]);

            const handleListeningJump = (step) => {
                setListeningIndex(prev => {
                    const len = currentVocabList.length;
                    if (len === 0) return 0;
                    let next = prev + step;
                    if (next < 0) next = (next % len + len) % len;
                    if (next >= len) next = next % len;
                    return next;
                });
            };

            const [isSpeaking, setIsSpeaking] = useState(false);
            const isSpeakingRef = React.useRef(false);
            const speakSequenceIdRef = React.useRef(0);

            const stopCurrentAudio = () => {
                isSpeakingRef.current = false;
                setIsSpeaking(false);
                if (currentAudioSourceRef.current) {
                    try {
                        currentAudioSourceRef.current.stop();
                        currentAudioSourceRef.current.disconnect();
                    } catch(e) {}
                    currentAudioSourceRef.current = null;
                }
            };

            const handleStopClick = () => {
                setIsPlaying(false);
                setIsStopped(true);
                stopCurrentAudio();
            };

            const handlePlayPauseClick = () => {
                getAudioCtx();
                if (!isPlaying) {
                    if (isStopped) {
                        const len = currentVocabList.length;
                        const currentAbsoluteIdx = listeningPlaylist.length > 0 ? listeningPlaylist[listeningIndex] : 0;
                        setListeningPlaylist(generatePlaylist(len, isListeningRandom, isListeningRandom ? 0 : currentAbsoluteIdx));
                        setListeningIndex(0);
                        setIsStopped(false);
                    }
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                }
            };

            const speak = async (targetWord, isFull = false) => {
                const ctx = getAudioCtx();
                if (isSpeakingRef.current) stopCurrentAudio();

                setIsSpeaking(true);
                isSpeakingRef.current = true;
                const currentSeq = ++speakSequenceIdRef.current;

                const playQueue = [`./audio/${targetWord.id}_ja.mp3`];
                if (isFull && targetWord.example) playQueue.push(`./audio/${targetWord.id}_ex_ja.mp3`);

                for (const url of playQueue) {
                    if (speakSequenceIdRef.current !== currentSeq) break;
                    try {
                        let response = null; let fetchSuccess = false;
                        for (let attempt = 1; attempt <= 3; attempt++) {
                            try { response = await fetch(url); if (response.ok) { fetchSuccess = true; break; } }
                            catch (e) { if (attempt === 3) break; await new Promise(r => setTimeout(r, 200)); }
                        }
                        if (!fetchSuccess) {
                            if (window.location.protocol === 'file:') {
                                alert("⚠️ Safari 安全限制警告\n\niOS Safari 嚴格禁止在單機模式 (file://) 下讀取音檔。\n請上傳至 GitHub Pages 上測試。");
                                break;
                            }
                            continue;
                        }

                        const arrayBuffer = await response.arrayBuffer();
                        const audioBuffer = await new Promise((res, rej) => ctx.decodeAudioData(arrayBuffer, res, rej));
                        if (speakSequenceIdRef.current !== currentSeq) break;

                        await new Promise(resolve => {
                            const source = ctx.createBufferSource();
                            source.buffer = audioBuffer;
                            source.connect(ctx.destination);
                            currentAudioSourceRef.current = source;
                            source.onended = resolve;
                            source.start(0);
                        });
                    } catch (e) { console.warn(`語音播放失敗略過: ${url}`, e); }
                }

                if (speakSequenceIdRef.current === currentSeq) {
                    setIsSpeaking(false);
                    isSpeakingRef.current = false;
                }
            };

            // 升級統計更新邏輯，加入近 10 次歷史紀錄
            const updateStats = (id, isCorrect) => {
                setStats(prev => {
                    const s = prev[id] || { correct: 0, wrong: 0, history: [] };
                    const newHistory = [...(s.history || []), isCorrect].slice(-10);
                    return {
                        ...prev,
                        [id]: {
                            correct: s.correct + (isCorrect ? 1 : 0),
                            wrong: s.wrong + (isCorrect ? 0 : 1),
                            history: newHistory
                        }
                    };
                });
            };

            // --- 聽力測驗播放特效與邏輯 ---
            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary && examQuestions.length > 0) {
                    const word = examQuestions[examIndex].word;
                    speak(word, true); // 自動播日文單字 + 例句
                }
            }, [examIndex, currentTab, examConfig.type, showSummary]);

            // --- 聽力測驗 10 秒計時器 ---
            const handleTimeOut = useCallback(() => {
                if (examSubmitted) return; // 已經答題就不要再觸發超時
                const q = examQuestions[examIndex];

                setExamSubmitted(true);
                setExamAnswers({ listening: null }); // 標記為：超時未選

                updateStats(q.word.id, false); // 超時算錯
                setTestedWords(prev => [...prev, { word: q.word, isCorrect: false }]);
                stopCurrentAudio();

                // 停留 2 秒公佈正確答案後，再進入下一題
                examTimeoutRef.current = setTimeout(() => {
                    setExamSubmitted(false);
                    setExamAnswers({});
                    if (examIndex + 1 < examQuestions.length) {
                        setExamIndex(prev => prev + 1);
                        setTimeLeft(10);
                    } else {
                        finishExam();
                    }
                }, 2000);
            }, [examIndex, examQuestions, examSubmitted]);

            useEffect(() => {
                if (currentTab === 'exam' && examConfig.type === 'listening' && !showSummary) {
                    if (examSubmitted) return; // 👉 新增：答題後暫停計時器，給予 2 秒觀看解答的時間
                    if (timeLeft <= 0) {
                        handleTimeOut();
                        return;
                    }
                    const timerId = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearTimeout(timerId);
                }
            }, [timeLeft, currentTab, examConfig.type, showSummary, handleTimeOut, examSubmitted]);

            const finishExam = () => {
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current); // 清除可能殘留的 2 秒跳轉
                stopCurrentAudio();
                setShowSummary(true);
            };

            const startExam = () => {
                getAudioCtx(); // 👉 同步喚醒音效引擎 (解決你剛剛遇到的 ReferenceError)
                if (examTimeoutRef.current) clearTimeout(examTimeoutRef.current);

                if (examConfig.type === 'standard') {
                    const hiddenCount = [examConfig.hideKanji, examConfig.hideKana, examConfig.hideMeaning].filter(Boolean).length;
                    if (hiddenCount === 0 || hiddenCount > 2) {
                        alert("請選擇遮擋 1 到 2 個欄位！");
                        return;
                    }
                }

                let pool = [...currentVocabList];
                if (examConfig.mode === 'mistakes') {
                    pool = pool.filter(v => ((stats[v.id] && stats[v.id].wrong) || 0) > 0);
                    if (pool.length < 4) { alert("答錯題目太少，無法進行錯題模式！(至少需4題)"); return; }
                } else if (examConfig.mode === 'weighted') {
                    pool.sort((a, b) => {
                        const rateA = ((stats[a.id] && stats[a.id].wrong) || 0) / (((stats[a.id] && stats[a.id].correct) || 0) + ((stats[a.id] && stats[a.id].wrong) || 0) + 1);
                        const rateB = ((stats[b.id] && stats[b.id].wrong) || 0) / (((stats[b.id] && stats[b.id].correct) || 0) + ((stats[b.id] && stats[b.id].wrong) || 0) + 1);
                        return (Math.random() * (1 - rateA)) - (Math.random() * (1 - rateB));
                    });
                } else {
                    pool.sort(() => Math.random() - 0.5);
                }

                const generateOptions = (correctWord, field) => {
                    const options = new Set([correctWord[field]]);
                    while(options.size < 4 && options.size < currentVocabList.length) {
                        const randomWord = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
                        options.add(randomWord[field]);
                    }
                    return Array.from(options).sort(() => Math.random() - 0.5);
                };

                const questions = pool.map(word => ({
                    word,
                    optionsKanji: (examConfig.type === 'listening' || examConfig.hideKanji) ? generateOptions(word, 'kanji') : null,
                    optionsKana: (examConfig.type !== 'listening' && examConfig.hideKana) ? generateOptions(word, 'kana') : null,
                    optionsMeaning: (examConfig.type !== 'listening' && examConfig.hideMeaning) ? generateOptions(word, 'meaning') : null,
                }));

                setExamQuestions(questions);
                setExamIndex(0);
                setExamAnswers({});
                setExamSubmitted(false);
                setTestedWords([]);
                setShowSummary(false);
                setTimeLeft(10);
                setCurrentTab('exam');
            };

            const submitStandardAnswer = () => {
                const q = examQuestions[examIndex];
                let isCorrect = true;
                if (examConfig.hideKanji && examAnswers.kanji !== q.word.kanji) isCorrect = false;
                if (examConfig.hideKana && examAnswers.kana !== q.word.kana) isCorrect = false;
                if (examConfig.hideMeaning && examAnswers.meaning !== q.word.meaning) isCorrect = false;

                updateStats(q.word.id, isCorrect);
                setTestedWords(prev => {
                    if (prev.find(p => p.word.id === q.word.id)) return prev;
                    return [...prev, { word: q.word, isCorrect }];
                });

                                                標準測驗
                                            </button>
                                            <button onClick={() => setExamConfig({ ...examConfig, type: 'listening' })} className={`py-3 rounded-xl font-bold border transition-colors ${examConfig.type === 'listening' ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}`}>
                                                聽力測驗 <span className="text-[10px] bg-red-500 text-white px-1.5 py-0.5 rounded-full ml-1">10s</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`mb-6 transition-opacity ${examConfig.type === 'listening' ? 'opacity-30 pointer-events-none' : ''}`}>
                                        <p className="text-sm font-bold text-slate-500 mb-2">要遮擋哪些欄位？(最多選 2 個)</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideKanji?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                                <input type="checkbox" className="hidden" checked={examConfig.hideKanji} onChange={(e)=>setExamConfig({...examConfig, hideKanji: e.target.checked})} /> 漢字
                                            </label>
                                            <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideKana?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                                <input type="checkbox" className="hidden" checked={examConfig.hideKana} onChange={(e)=>setExamConfig({...examConfig, hideKana: e.target.checked})} /> 假名
                                            </label>
                                            <label className={`block text-center py-2 border rounded-xl font-bold cursor-pointer transition-colors ${examConfig.hideMeaning?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-slate-50 text-slate-500'}`}>
                                                <input type="checkbox" className="hidden" checked={examConfig.hideMeaning} onChange={(e)=>setExamConfig({...examConfig, hideMeaning: e.target.checked})} /> 中文
                                            </label>
                                        </div>
                                    </div>

                                    <div className="mb-8">
                                        <p className="text-sm font-bold text-slate-500 mb-2">出題邏輯</p>
                                        <select className="w-full p-3 border rounded-xl bg-slate-50 text-slate-700 font-bold outline-none focus:border-blue-500" value={examConfig.mode} onChange={(e)=>setExamConfig({...examConfig, mode: e.target.value})}>
                                            <option value="random">完全隨機抽考</option>
                                            <option value="weighted">弱點加權 (錯越多越容易出)</option>
                                            <option value="mistakes">地獄錯題本 (只考曾經錯過的)</option>
                                        </select>
                                    </div>

                                    <button onClick={startExam} className="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-slate-700 transition-colors">
                                        <i className="fas fa-play mr-2"></i>開始測驗
                                    </button>
                                </div>
                            )}

                            {currentTab === 'exam' && showSummary && (() => {
                                const sortedWords = [...testedWords].sort((a, b) => {
                                    const wrongA = (stats[a.word.id] && stats[a.word.id].wrong) || 0;
                                    const wrongB = (stats[b.word.id] && stats[b.word.id].wrong) || 0;
                                    return wrongB - wrongA; // 錯誤次數由大到小
                                });

                                return (
                                    <div className="flex flex-col flex-1 h-full">
                                        <h2 className="text-2xl font-bold text-slate-800 mb-4 text-center"><i className="fas fa-clipboard-check mr-2 text-blue-500"></i>本次考試總結</h2>

                                        <div className="bg-white rounded-2xl shadow-sm p-4 flex-1 overflow-y-auto mb-4 border border-slate-100 max-h-[60vh]">
                                            {sortedWords.length === 0 ? (
                                                <div className="text-center text-slate-400 py-10 font-bold mt-10">本次沒有作答紀錄</div>
                                            ) : (
                                                <div className="flex flex-col gap-4">
                                                    {sortedWords.map((item, idx) => {
                                                        const s = stats[item.word.id] || { correct: 0, wrong: 0, history: [] };
                                                        const history = s.history || [];
                                                        const recent10 = history.slice(-10);
                                                        const recentWrong = recent10.filter(res => !res).length;

                                                        return (
                                                            <div key={idx} className="flex flex-col p-4 bg-slate-50 rounded-xl border border-slate-200 relative">
                                                                <div className="absolute top-4 right-4 text-2xl">
                                                                    {item.isCorrect ? <i className="fas fa-check-circle text-green-500"></i> : <i className="fas fa-times-circle text-red-500"></i>}
                                                                </div>
                                                                <div className="text-xl font-bold text-slate-800 mb-1">{item.word.kanji}</div>
                                                                <div className="text-xs text-slate-500 mb-3">{item.word.kana} | {item.word.meaning}</div>

                                                                <div className="grid grid-cols-2 gap-2 text-xs font-bold text-slate-600 mb-3">
                                                                    <div className="bg-white py-2 px-3 rounded-lg border border-slate-200 text-center shadow-sm">
                                                                        有史以來錯誤 <br/><span className="text-red-500 text-lg">{s.wrong}</span> 次
                                                                    </div>
                                                                    <div className="bg-white py-2 px-3 rounded-lg border border-slate-200 text-center shadow-sm">
                                                                        近 10 次錯誤 <br/><span className="text-red-500 text-lg">{recentWrong}</span> 次
                                                                    </div>
                                                                </div>

                                                                <div className="flex items-center mt-1 bg-white p-2 rounded-lg border border-slate-100">
                                                                    <span className="text-[10px] text-slate-400 mr-2 font-bold w-14">近10次軌跡</span>
                                                                    <div className="flex gap-1">
                                                                        {recent10.map((res, i) => (
                                                                            <div key={i} className={`w-3 h-3 rounded-full ${res ? 'bg-green-400' : 'bg-red-400'} shadow-sm`}></div>
                                                                        ))}
                                                                        {Array.from({length: 10 - recent10.length}).map((_, i) => (
                                                                            <div key={'empty'+i} className="w-3 h-3 rounded-full bg-slate-200"></div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            )}
                                        </div>

                                        <button onClick={() => { setShowSummary(false); setCurrentTab('exam_setup'); }} className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg hover:bg-slate-700 active:scale-95 transition-all">
                                            返回設定
                                        </button>
                                    </div>
                                );
                            })()}

                            {currentTab === 'exam' && examQuestions.length > 0 && !showSummary && (() => {
                                const q = examQuestions[examIndex];

                                const renderOptions = (title, field, options) => {
                                    if (!options) return null;
                                    return (
                                        <div className="mb-4">
                                            <div className="text-xs font-bold text-slate-400 mb-2">選擇正確的{title}</div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {options.map((opt, i) => {
                                                    const isSelected = examAnswers[field] === opt;
                                                    const isCorrectAns = q.word[field] === opt;
                                                    let btnClass = "py-3 px-2 text-sm rounded-lg border font-bold transition-colors ";

                                                    if (!examSubmitted) {
                                                        btnClass += isSelected ? "bg-blue-100 border-blue-500 text-blue-700 shadow-sm" : "bg-white text-slate-600 hover:bg-slate-50";
                                                    } else {
                                                        if (isCorrectAns) btnClass += "bg-green-100 border-green-500 text-green-700";
                                                        else if (isSelected && !isCorrectAns) btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                        else btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                    }
                                                    return (
                                                        <button key={i} disabled={examSubmitted} onClick={() => setExamAnswers({...examAnswers, [field]: opt})} className={btnClass}>
                                                            {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                };

                                const allAnswered = (!examConfig.hideKanji || examAnswers.kanji) && (!examConfig.hideKana || examAnswers.kana) && (!examConfig.hideMeaning || examAnswers.meaning);

                                return (
                                    <div className="flex flex-col flex-1">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="text-sm font-bold text-slate-500">
                                                進度：{examIndex + 1} / {examQuestions.length}
                                            </div>
                                            <button onClick={finishExam} className="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-full font-bold hover:bg-red-100 border border-red-200 active:scale-95 transition-all">
                                                <i className="fas fa-stop-circle mr-1"></i>提前結束
                                            </button>
                                        </div>

                                        {examConfig.type === 'listening' && (
                                            <div className="mb-4 bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                                                <div className="flex justify-between text-xs font-bold text-slate-400 mb-2">
                                                    <span className="flex items-center"><i className="fas fa-stopwatch mr-1"></i>剩餘時間</span>
                                                    <span className={timeLeft <= 3 ? 'text-red-500 animate-pulse' : 'text-blue-500'}>{timeLeft} 秒</span>
                                                </div>
                                                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                                    <div className={`h-full transition-all duration-1000 linear ${timeLeft <= 3 ? 'bg-red-500' : 'bg-blue-500'}`} style={{ width: `${(timeLeft / 10) * 100}%` }}></div>
                                                </div>
                                            </div>
                                        )}

                                        <div className="bg-white rounded-2xl shadow-sm p-6 mb-4 border border-slate-100 flex-1 flex flex-col">
                                            {examConfig.type === 'standard' ? (
                                                <React.Fragment>
                                                    <div className="text-center mb-6">
                                                        <div className="text-xs font-bold text-blue-400 mb-2">請看題</div>
                                                        {!examConfig.hideKanji && <div className="text-4xl font-bold mb-2">{q.word.kanji}</div>}
                                                        {!examConfig.hideKana && <div className="text-2xl text-slate-600 mb-2">{q.word.kana}</div>}
                                                        {!examConfig.hideMeaning && <div className="text-xl text-blue-600 font-bold">{q.word.meaning}</div>}
                                                    </div>
                                                    <hr className="my-4 border-slate-100" />
                                                    {renderOptions("漢字", "kanji", q.optionsKanji)}
                                                    {renderOptions("假名", "kana", q.optionsKana)}
                                                    {renderOptions("中文", "meaning", q.optionsMeaning)}
                                                </React.Fragment>
                                            ) : (
                                                <React.Fragment>
                                                    <div className="text-center py-6 mb-6">
                                                        <i className="fas fa-headphones-alt text-6xl text-blue-500 mb-6 animate-pulse drop-shadow-md"></i>
                                                        <div className="text-sm font-bold text-slate-500 bg-slate-50 inline-block px-4 py-2 rounded-full border border-slate-100">
                                                            請仔細聽發音，並選出正確的漢字
                                                        </div>
                                                    </div>
                                                    <hr className="my-4 border-slate-100" />
                                                    <div className="grid grid-cols-2 gap-3 mt-auto">
                                                        {q.optionsKanji.map((opt, i) => {
                                                            let btnClass = "py-5 px-2 text-xl rounded-xl border-2 font-bold transition-all shadow-sm ";

                                                            if (!examSubmitted) {
                                                                btnClass += "bg-white text-slate-700 hover:bg-blue-50 border-slate-100 hover:border-blue-300 active:scale-95";
                                                            } else {
                                                                const isSelected = examAnswers.listening === opt;
                                                                const isCorrectAns = q.word.kanji === opt;

                                                                if (isCorrectAns) {
                                                                    btnClass += "bg-green-100 border-green-500 text-green-700";
                                                                } else if (isSelected && !isCorrectAns) {
                                                                    btnClass += "bg-red-100 border-red-500 text-red-700 line-through";
                                                                } else {
                                                                    btnClass += "bg-slate-50 text-slate-400 border-slate-200 opacity-50";
                                                                }
                                                            }

                                                            return (
                                                                <button key={i} disabled={examSubmitted} onClick={() => handleListeningAnswer(opt)} className={btnClass}>
                                                                    {opt}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </React.Fragment>
                                            )}
                                        </div>

                                        {examConfig.type === 'standard' && (
                                            !examSubmitted ? (
                                                <button onClick={submitStandardAnswer} disabled={!allAnswered} className={`py-4 rounded-xl font-bold w-full mt-auto transition-all ${allAnswered ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                    確認答案
                                                </button>
                                            ) : (
                                                <button onClick={() => {
                                                    if (examIndex + 1 < examQuestions.length) {
                                                        setExamIndex(examIndex + 1); setExamAnswers({}); setExamSubmitted(false);
                                                    } else {
                                                        finishExam();
                                                    }
                                                }} className="py-4 bg-slate-800 text-white rounded-xl font-bold w-full mt-auto shadow-lg hover:bg-slate-700">
                                                    {examIndex + 1 < examQuestions.length ? "下一題" : "查看總結"}
                                                </button>
                                            )
                                        )}
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
